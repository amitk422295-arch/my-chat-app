<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>My Chat App</title>
  <meta name="theme-color" content="#08080c">
  <script src="/socket.io/socket.io.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { width: 100%; height: 100%; height: 100dvh; background: #08080c; color: #f0f2f5; overflow: hidden; position: fixed; inset: 0; }
    .bg-heart-pattern { position: fixed; inset: 0; pointer-events: none; opacity: 0.06; z-index: 0; background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="white"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>'); background-size: 54px 54px; }
    #toastBox { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1e1e2c; border: 1px solid rgba(255,255,255,0.15); padding: 12px 20px; border-radius: 30px; font-size: 13px; font-weight: 600; display: none; align-items: center; gap: 8px; z-index: 999; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    #toastBox.error { border-color: #ff3b5c; color: #ff6b8b; }
    #toastBox.success { border-color: #00c853; color: #00ff88; }
    #toastBox.info { border-color: #5ac8fa; color: #5ac8fa; }
    
    .screen-flow { position: fixed; inset: 0; background: radial-gradient(circle at top, #141420 0%, #08080c 100%); z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; overflow-y: auto; }
    .glass-card { width: 100%; max-width: 360px; background: rgba(22, 22, 32, 0.95); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.12); border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 10px; text-align: center; box-shadow: 0 16px 40px rgba(0,0,0,0.6); max-height: 92vh; overflow-y: auto; }
    .input-box { width: 100%; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18); border-radius: 14px; padding: 12px 16px; color: #fff; font-size: 14px; outline: none; user-select: text; }
    .input-box:focus { border-color: #ff3b5c; background: rgba(255,255,255,0.12); }
    .btn-gradient { background: linear-gradient(135deg, #ff3b5c 0%, #ff6b8b 100%); color: #fff; border: none; padding: 13px; border-radius: 14px; font-weight: 600; font-size: 15px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(255,59,92,0.4); }
    .dp-circle { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; margin: 0 auto; background: #181822; border: 3px dashed #ff3b5c; cursor: pointer; }
    
    #mainApp { display: none; flex-direction: column; width: 100%; height: 100%; height: 100dvh; position: absolute; inset: 0; z-index: 1; overflow: hidden; }
    .top-navbar { background: rgba(16,16,24,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.06); padding: 14px 18px 0; display: flex; flex-direction: column; gap: 10px; flex: none; }
    .nav-tabs { display: flex; }
    .nav-tab { flex: 1; text-align: center; padding: 10px 0; font-size: 13px; font-weight: 700; color: #7e7e92; cursor: pointer; border-bottom: 2px solid transparent; }
    .nav-tab.active { color: #ff3b5c; border-bottom-color: #ff3b5c; }
    .top-actions { display:flex; align-items:center; gap:8px; }
    .icon-btn { width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:#191922;color:#fff;font-size:20px;cursor:pointer; }
    .menu-panel { position:fixed; top:62px; right:12px; width:250px; z-index:210; display:none; background:#171720; border:1px solid rgba(255,255,255,.12); border-radius:18px; padding:8px; box-shadow:0 20px 60px rgba(0,0,0,.75); }
    .menu-panel button { width:100%; border:0; background:transparent; color:#fff; padding:13px 12px; text-align:left; border-radius:12px; font-size:14px; cursor:pointer; }
    .menu-panel button:hover { background:rgba(255,255,255,.08); }
    .menu-panel .danger { color:#ff6b8b; }
    .modal { position:fixed; inset:0; z-index:220; display:none; align-items:center; justify-content:center; padding:18px; background:rgba(0,0,0,.76); }
    .modal-card { width:100%; max-width:390px; max-height:88vh; overflow:auto; background:#171720; border:1px solid rgba(255,255,255,.12); border-radius:24px; padding:22px; box-shadow:0 20px 70px rgba(0,0,0,.85); }
    .status-row { display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid rgba(255,255,255,.06); cursor:pointer; }
    .status-avatar-inner { width:100%;height:100%;border-radius:50%;object-fit:cover;background:#222;display:block; }
    .panes-wrapper { flex: 1; position: relative; overflow: hidden; }
    .tab-pane { position: absolute; inset: 0; display: none; flex-direction: column; overflow-y: auto; background: #0c0c12; }
    .tab-pane.active { display: flex; }
    
    .chat-row { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,0.04); cursor: pointer; }
    .chat-row:hover { background: rgba(255,255,255,0.02); }
    .chat-row img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
    
    #chatRoom { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; background: #09090e; z-index: 60; display: none; flex-direction: column; overflow: hidden; }
    .bottom-input-bar { background: #121218; border-top: 1px solid rgba(255,255,255,0.06); padding: 10px 14px; display: flex; align-items: center; gap: 10px; flex: none; }
    .input-wrapper { flex: 1; display: flex; align-items: center; background: #1c1c26; border-radius: 24px; padding: 6px 14px; }
    .input-wrapper [contenteditable]:empty::before { content: attr(placeholder); color: #888; pointer-events: none; }
    
    .btn-circle { width: 40px; height: 40px; border-radius: 50%; background: #ff3b5c; border: none; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
    #roomMessages { display:flex; flex-direction:column; gap:6px; background:#0b0b11; padding: 14px; flex: 1; overflow-y: auto; }
    
    .msg-bubble { position:relative; max-width:78%; padding:9px 11px 5px; border-radius:12px; font-size:14px; line-height:1.4; word-break:break-word; white-space:pre-wrap; cursor:pointer; }
    .msg-bubble.mine { align-self:flex-end; background:#ff3b5c; border-bottom-right-radius:4px; }
    .msg-bubble.theirs { align-self:flex-start; background:#20202a; border-bottom-left-radius:4px; }
    .msg-time { display:block; text-align:right; font-size:9px; opacity:.7; margin-top:3px; }
    
    @keyframes pulseSkeleton { 0% { opacity: 0.4; transform: scale(0.98); } 50% { opacity: 1; transform: scale(1.02); } 100% { opacity: 0.4; transform: scale(0.98); } }
    .reel-uploading { animation: pulseSkeleton 1.2s infinite ease-in-out !important; }

    #imageModal { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 10px; }
    #imageModal img { max-width: 100%; max-height: 100vh; object-fit: contain; border-radius: 4px; }
    #imageModal .close-btn { position: absolute; top: 20px; right: 20px; color: #fff; font-size: 30px; background: transparent; border: none; cursor: pointer; }
  </style>
</head>
<body>

  <div class="bg-heart-pattern"></div>
  <div id="toastBox"></div>

  <div id="imageModal" onclick="closeImageModal()">
    <button class="close-btn">✕</button>
    <img id="fullScreenImage" src="">
  </div>

  <!-- AUTH SCREEN -->
  <div id="screenAuth" class="screen-flow">
    <div class="glass-card">
      <div style="font-size:34px;">💖</div>
      <h3 style="color:#fff;" id="authTitle">Create Account</h3>
      <div id="viewRegister" style="display:flex; flex-direction:column; gap:10px;">
        <input type="file" id="dpFileInput" accept="image/*" style="display:none;" onchange="previewDp(this)">
        <img id="dpViewer" class="dp-circle" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%239ca3af' d='M256 288c79.5 0 144-64.5 144-144S335.5 0 256 0 112 64.5 112 144s64.5 144 144 144zm128 32h-55.1c-22.2 10.2-47.5 16-72.9 16s-50.6-5.8-72.9-16H128C57.3 320 0 377.3 0 448v16c0 26.5 21.5 48 48 48h416c26.5 0 48-21.5 48-48v-16c0-70.7-57.3-128-128-128z'/></svg>" onclick="document.getElementById('dpFileInput').click()">
        <input type="text" id="regNameInput" class="input-box" placeholder="Your Name (Optional)">
        <input type="tel" id="regMobileInput" class="input-box" placeholder="Mobile Number * (Compulsory)" maxlength="13">
        <input type="text" id="regUserIdInput" class="input-box" placeholder="User ID * (e.g. @amit123)">
        <input type="password" id="regPassInput" class="input-box" placeholder="Password * (8 digits)" maxlength="8">
        <input type="text" id="regQ1Input" class="input-box" placeholder="1. Pet's name?">
        <input type="text" id="regQ2Input" class="input-box" placeholder="2. Best friend?">
        <button class="btn-gradient" type="button" onclick="handleRegisterCustom()" style="margin-top:4px;">Register Now ➔</button>
      </div>
      <div id="viewLogin" style="display:none; flex-direction:column; gap:12px;">
        <input type="text" id="loginIdInput" class="input-box" placeholder="User ID or Mobile">
        <input type="password" id="loginPassInput" class="input-box" placeholder="Password" maxlength="8">
        <button class="btn-gradient" type="button" onclick="handleLogin()">Login</button>
        <div style="display:flex; justify-content:flex-end; font-size:12px;">
          <span style="color:#ff6b8b; cursor:pointer;" onclick="openForgotModal()">Forgot ID / Password?</span>
        </div>
      </div>
      <p style="font-size:12px;color:#7e7e92;cursor:pointer;margin-top:6px;" onclick="toggleAuthMode()" id="authSwitchText">Already have an account? Login</p>
    </div>
  </div>

  <!-- FORGOT MODAL -->
  <div id="forgotModal" class="modal" onclick="if(event.target===this)closeForgotModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <h3 style="margin-bottom:8px;">Recover Account</h3>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <input type="tel" id="recMobileInput" class="input-box" placeholder="Registered Mobile *">
        <input type="text" id="recQ1Input" class="input-box" placeholder="1. Pet's name">
        <input type="text" id="recQ2Input" class="input-box" placeholder="2. Best friend">
        <input type="password" id="recNewPassInput" class="input-box" placeholder="New 8-digit Password (Optional)" maxlength="8">
        <button class="btn-gradient" onclick="submitRecovery()">Recover</button>
      </div>
      <div id="recoveryResultDisplay" style="font-size:13px; color:#00ff88; font-weight:700; margin-top:10px; text-align:center;"></div>
      <button class="icon-btn" style="margin:14px auto 0; display:block;" onclick="closeForgotModal()">✕</button>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="mainApp">
    <div class="top-navbar">
      <div style="font-size:20px;font-weight:800;display:flex;justify-content:space-between;align-items:center;">
        <span>💖 My Chat App</span>
        <div class="top-actions">
          <button class="icon-btn" onclick="toggleAppMenu(event)" aria-label="Menu">⋮</button>
        </div>
      </div>
      <div class="nav-tabs">
        <div class="nav-tab active" onclick="switchTab('paneChats', this)">CHATS</div>
        <div class="nav-tab" onclick="switchTab('paneStatus', this); loadStatuses();">REELS</div>
        <div class="nav-tab" onclick="switchTab('paneCalls', this); loadCalls();">CALLS</div>
      </div>
    </div>

    <div class="panes-wrapper">
      <div class="tab-pane active" id="paneChats">
        <div style="padding:12px;display:flex;gap:8px;">
          <input type="text" id="directSearchInput" class="input-box" placeholder="Search @userid or mobile">
          <button class="btn-gradient" onclick="openDirectChat()">Chat</button>
        </div>
        <div id="chatsList"></div>
      </div>

      <div class="tab-pane" id="paneStatus">
        <div style="padding:16px;">
          <input type="file" id="statusMediaInput" accept="image/*,video/*" style="display:none;" onchange="uploadStatusMedia(this)">
          
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; padding-bottom:16px; border-bottom:1px solid rgba(255,255,255,0.06);">
            <div style="display:flex; align-items:center; gap:14px; cursor:pointer;" onclick="handleMyStatusClick()">
              <div id="myStatusRing" style="width:56px; height:56px; border-radius:50%; background:#1c1c26; border:2px dashed #ff3b5c; display:flex; align-items:center; justify-content:center; font-size:26px; color:#ff3b5c; flex:none; padding:2px;">+</div>
              <div>
                <div style="font-weight:700; font-size:15px; color:#fff;">My Reel</div>
                <div id="myStatusArea" style="font-size:12px; color:#7e7e92; margin-top:2px;">Tap to post a reel</div>
              </div>
            </div>
            <button class="icon-btn" style="width:36px; height:36px; font-size:18px; display:flex; align-items:center; justify-content:center; background:#ff3b5c; color:#fff; border:none;" onclick="document.getElementById('statusMediaInput').click()">+</button>
          </div>
          <div style="font-size:13px; font-weight:700; color:#7e7e92; margin-bottom:12px;">RECENT REELS</div>
          <div id="contactStatusesArea"></div>
        </div>
      </div>

      <div class="tab-pane" id="paneCalls">
        <div id="callsList" style="padding:16px;">Call history empty.</div>
      </div>
    </div>
  </div>

  <!-- APP MENU -->
  <div id="appMenu" class="menu-panel" onclick="event.stopPropagation()">
    <button onclick="openMyProfile()">👤 My Profile</button>
    <button class="danger" onclick="logoutApp()">🚪 Logout</button>
  </div>

  <!-- CHAT ROOM -->
  <div id="chatRoom">
    <div style="padding:14px;background:#121218;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,0.06);">
      <button onclick="closeChatRoom()" style="background:transparent;border:none;color:#fff;font-size:18px;cursor:pointer;">←</button>
      <img id="roomUserAvatar" src="" style="width:40px;height:40px;border-radius:50%;object-fit:cover;cursor:pointer;" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 512 512\'><path fill=\'%239ca3af\' d=\'M256 288c79.5 0 144-64.5 144-144S335.5 0 256 0 112 64.5 112 144s64.5 144 144 144zm128 32h-55.1c-22.2 10.2-47.5 16-72.9 16s-50.6-5.8-72.9-16H128C57.3 320 0 377.3 0 448v16c0 26.5 21.5 48 48 48h416c26.5 0 48-21.5 48-48v-16c0-70.7-57.3-128-128-128z\'/></svg>'">
      <div style="flex:1;">
        <div id="roomUserName" style="font-weight:700;font-size:15px;">User</div>
        <div id="roomUserStatus" style="font-size:11px;color:#00ff88;">Online</div>
      </div>
      <div style="position:relative;">
        <button class="icon-btn" onclick="toggleChatRoomMenu(event)" style="background:transparent; border:none; color:#fff; font-size:20px;">⋮</button>
        <div id="chatRoomMenu" class="menu-panel" style="top:40px; right:0;">
          <button onclick="clearCurrentChat()">🧹 Clear Chat</button>
        </div>
      </div>
    </div>
    <div id="roomMessages" style="flex:1;overflow-y:auto;"></div>
    
    <div class="bottom-input-bar">
      <input type="file" id="chatMediaInput" style="display:none" accept="image/*,video/*,.pdf,.doc,.docx,.txt,.zip" onchange="sendMediaFile(this)">
      <button class="icon-btn" style="width:38px;height:38px;font-size:20px;flex:none;background:#1c1c26;display:flex;align-items:center;justify-content:center;" onclick="document.getElementById('chatMediaInput').click()">📎</button>
      <div class="input-wrapper">
        <div id="msgInputBox" contenteditable="true" placeholder="Type a message or paste..." style="flex:1; background:transparent; border:none; color:#fff; font-size:15px; outline:none; min-height:20px; max-height:100px; overflow-y:auto;"></div>
      </div>
      <button class="btn-circle" onclick="sendChatMessage()">➤</button>
    </div>
  </div>

  <div id="myProfileModal" class="modal" onclick="if(event.target===this)closeMyProfile()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <h3 style="text-align:center;margin-bottom:14px;">My Profile</h3>
      <input type="file" id="profileAvatarInput" accept="image/*" style="display:none;" onchange="changeMyAvatar(this)">
      <img id="myProfileAvatar" class="profile-edit-avatar" src="" style="width:90px;height:90px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 12px;border:3px solid #ff3b5c;cursor:pointer;" onclick="document.getElementById('profileAvatarInput').click()">
      <input id="myProfileName" class="input-box" placeholder="Full Name">
      <div id="myProfileId" style="font-size:12px;color:#888;margin:10px 0;text-align:center"></div>
      <button class="btn-gradient" style="width:100%" onclick="saveMyProfile()">Save Profile</button>
      <button class="icon-btn" style="margin:12px auto 0;display:block" onclick="closeMyProfile()">✕</button>
    </div>
  </div>

  <script>
    const socket = io({ transports: ['websocket', 'polling'], reconnection: true });
    const DEFAULT_AVATAR = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%239ca3af' d='M256 288c79.5 0 144-64.5 144-144S335.5 0 256 0 112 64.5 112 144s64.5 144 144 144zm128 32h-55.1c-22.2 10.2-47.5 16-72.9 16s-50.6-5.8-72.9-16H128C57.3 320 0 377.3 0 448v16c0 26.5 21.5 48 48 48h416c26.5 0 48-21.5 48-48v-16c0-70.7-57.3-128-128-128z'/></svg>";

    let authMode = 'reg'; let regDpBase64 = ''; let currentUserData = null; let currentChatTarget = null; let uploadToken = '';
    let unreadMap = {}; 
    let uploadingReelData = null; 

    document.addEventListener('play', (e) => {
      if (e.target && e.target.tagName === 'VIDEO') {
        document.querySelectorAll('video').forEach(v => {
          if (v !== e.target) v.pause();
        });
      }
    }, true);

    const DB_NAME = 'MyChatLocalDB'; const DB_VERSION = 2; const CHAT_STORE = 'chats'; const APP_STORE = 'app'; const MEDIA_CACHE = 'mychat-media-v1';
    let dbPromise = null;

    function openLocalDB() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve) => {
        if (!('indexedDB' in window)) return resolve(null);
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(CHAT_STORE)) db.createObjectStore(CHAT_STORE, { keyPath: 'key' });
          if (!db.objectStoreNames.contains(APP_STORE)) db.createObjectStore(APP_STORE, { keyPath: 'key' });
        };
        req.onsuccess = () => resolve(req.result); req.onerror = () => resolve(null);
      }); return dbPromise;
    }

    async function idbPut(storeName, value) { const db = await openLocalDB(); if (!db) return; return new Promise(resolve => { const tx = db.transaction(storeName, 'readwrite'); tx.objectStore(storeName).put(value); tx.oncomplete = () => resolve(true); tx.onerror = () => resolve(false); }); }
    async function idbGet(storeName, key) { const db = await openLocalDB(); if (!db) return null; return new Promise(resolve => { const tx = db.transaction(storeName, 'readonly'); const req = tx.objectStore(storeName).get(key); req.onsuccess = () => resolve(req.result || null); req.onerror = () => resolve(null); }); }

    async function saveMessagesLocal(userCode, messages) { await idbPut(CHAT_STORE, { key: 'messages:' + String(userCode).toLowerCase(), messages: Array.isArray(messages) ? messages : [] }); }
    async function getMessagesLocal(userCode) { const row = await idbGet(CHAT_STORE, 'messages:' + String(userCode).toLowerCase()); return row?.messages || []; }
    async function saveContactsLocal(contacts) { await idbPut(APP_STORE, { key: 'contacts', contacts: Array.isArray(contacts) ? contacts : [] }); }
    async function getContactsLocal() { const row = await idbGet(APP_STORE, 'contacts'); return row?.contacts || []; }
    async function saveStatusesLocal(data) { await idbPut(APP_STORE, { key: 'statuses', data }); }
    async function getStatusesLocal() { const row = await idbGet(APP_STORE, 'statuses'); return row?.data || null; }

    async function cacheMediaUrl(url) {
      if (!url || !/^https?:\/\//i.test(url) || !('caches' in window)) return null;
      try {
        const cache = await caches.open(MEDIA_CACHE); const hit = await cache.match(url);
        if (hit) return URL.createObjectURL(await hit.blob());
        const response = await fetch(url, { mode: 'cors', cache: 'force-cache' });
        if (!response.ok) return null; await cache.put(url, response.clone()); return URL.createObjectURL(await response.blob());
      } catch (e) { return null; }
    }

    async function hydrateMediaCache(root = document) {
      const nodes = root.querySelectorAll('[data-media-url]');
      for (const node of nodes) {
        const url = node.getAttribute('data-media-url'); if (!url) continue;
        const localUrl = await cacheMediaUrl(url);
        if (localUrl) node.src = localUrl;
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      const savedUser = localStorage.getItem('chatAppUser');
      if (savedUser) {
        try {
          currentUserData = JSON.parse(savedUser);
          if (currentUserData?.userCode) {
            socket.emit('set-socket-user', { userCode: currentUserData.userCode }, res => { if (res?.token) uploadToken = res.token; });
            launchMainApp();
          }
        } catch (e) { localStorage.removeItem('chatAppUser'); }
      }
    });

    window.addEventListener('focus', () => { 
      if (currentUserData?.userCode) { 
        socket.emit('set-socket-user', { userCode: currentUserData.userCode }, res => { if (res?.token) uploadToken = res.token; });
        syncContacts(); 
        loadStatuses(true); 
        if (currentChatTarget) syncCurrentChat(true); 
      } 
    });

    let toastTimeout;
    function showToast(msg, type='info', duration=3500) {
      const t = document.getElementById('toastBox'); t.className = type; t.textContent = msg; t.style.display = 'flex';
      clearTimeout(toastTimeout); if(duration > 0) toastTimeout = setTimeout(()=> { if(t) t.style.display='none'; }, duration);
    }

    function toggleAuthMode() {
      authMode = authMode === 'login' ? 'reg' : 'login';
      document.getElementById('viewRegister').style.display = authMode === 'reg' ? 'flex' : 'none';

    async function deleteChatRow(userCode) {

        tx.objectStore(CHAT_STORE).delete('messages:' + String(userCode).toLowerCase());

    function loadContacts() { getContactsLocal().then(l => { if(l.length) renderContacts(l); }); syncContacts(); }
    function syncContacts() { 
      if (currentUserData?.userCode && socket.connected) {
        socket.emit('set-socket-user', { userCode: currentUserData.userCode }, res => { if (res?.token) uploadToken = res.token; });
        socket.emit('get-contacts');

    function openDirectChat() {
      const query = document.getElementById('directSearchInput').value.trim(); if (!query) return;
      socket.emit('open-direct-chat', { targetCode: query, query }, res => {
        if (res?.success) openChatWith(res.user.userCode, res.user.fullName, res.user.avatar);
        else showToast(res?.error || 'User not found', 'error');
      });

    async function openChatWith(uCode, name, avatar) {
      const cleanCode = String(uCode).toLowerCase();
      currentChatTarget = { userCode: cleanCode, name: name || 'User', avatar: avatar || DEFAULT_AVATAR };
      
      unreadMap[cleanCode] = 0;
      renderContacts(globalContacts);

      // Ensure authenticated before opening room
      if (currentUserData?.userCode) {
        socket.emit('set-socket-user', { userCode: currentUserData.userCode }, res => { if (res?.token) uploadToken = res.token; });
      }

      document.getElementById('roomUserName').textContent = currentChatTarget.name;
      document.getElementById('roomUserAvatar').src = currentChatTarget.avatar;
      document.getElementById('chatRoom').style.display = 'flex';
      const cached = await getMessagesLocal(currentChatTarget.userCode);
      if (cached.length) renderMessages(cached);
      syncCurrentChat(false);
      
      setTimeout(() => { document.getElementById('msgInputBox').focus(); }, 100);
    }

    async function syncCurrentChat(silent) {
      if (!currentChatTarget || !socket.connected) return;
      if (currentUserData?.userCode) {
        socket.emit('set-socket-user', { userCode: currentUserData.userCode }, res => { if (res?.token) uploadToken = res.token; });
      }
      const cached = await getMessagesLocal(currentChatTarget.userCode);
      const after = cached.length ? cached[cached.length - 1]?.createdAt : null;
      socket.emit('get-messages', { targetCode: currentChatTarget.userCode, after }, async res => {
        if (res?.success) {
          if (res.full) { await saveMessagesLocal(currentChatTarget.userCode, res.messages); renderMessages(res.messages); }
          else if (res.messages?.length) {
            const merged = [...cached, ...res.messages];
            await saveMessagesLocal(currentChatTarget.userCode, merged); renderMessages(merged);
          }
        }
      });
    }

    function closeChatRoom() { document.getElementById('chatRoom').style.display = 'none'; currentChatTarget = null; loadContacts(); }
    function escapeHtml(v) { return String(v ?? '').replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c])); }
    function escapeAttr(v) { return escapeHtml(v).replace(/`/g,'&#96;'); }
    function openFullScreenImage(src) { document.getElementById('fullScreenImage').src = src; document.getElementById('imageModal').style.display = 'flex'; }
    function closeImageModal() { document.getElementById('imageModal').style.display = 'none'; }

    function formatMessageContent(m) {
      const timeStr = new Date(m.createdAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
      let innerHtml = '';

      if (m.messageType === 'image') {
        innerHtml = `<img data-media-url="${escapeAttr(m.media)}" src="" onclick="openFullScreenImage(this.src)" style="max-width:100%;max-height:280px;border-radius:8px;display:block;margin-bottom:4px;cursor:pointer;">`;
      } else if (m.messageType === 'video') {
        innerHtml = `<video data-media-url="${escapeAttr(m.media)}" controls style="max-width:100%;max-height:280px;border-radius:8px;display:block;margin-bottom:4px;"></video>`;
      } else if (m.messageType === 'document') {
        innerHtml = `<div style="background:rgba(255,255,255,0.05); padding:10px; border-radius:8px; display:flex; align-items:center; gap:10px; margin-bottom:4px; border: 1px solid rgba(255,255,255,0.1);">
             <div style="font-size:24px;">📄</div><div style="flex:1; overflow:hidden;">
             <a href="${escapeAttr(m.media)}" target="_blank" rel="noopener noreferrer" style="color:#5ac8fa; text-decoration:none; font-weight:600; display:block; white-space:nowrap; text-overflow:ellipsis; overflow:hidden;">${escapeHtml(m.fileName || 'View Document')}</a>
             <div style="font-size:10px; color:#888; margin-top:2px;">Tap to open PDF/Doc</div></div></div>${escapeHtml(m.text)}`;
      } else {
        let txt = escapeHtml(m.text);
        const ytRegex = /(https?:\/\/(?:www\.)?(?:youtube\.com\/(?:[^\/\n\s]+\/\S+\/|(?:v|e(?:mbed)?)\/|\S*?[?&]v=)|youtu\.be\/)([a-zA-Z0-9_-]{11}))/g;
        const generalUrlRegex = /(https?:\/\/(?:www\.)?[-a-zA-Z0-9@:%._\+~#=]{1,256}\.[a-zA-Z0-9()]{1,6}\b(?:[-a-zA-Z0-9()@:%_\+.~#?&\/=]*))/g;
        
        if (ytRegex.test(txt)) {
          txt = txt.replace(ytRegex, (url, match, vidId) => `<div style="margin-top:6px;"><a href="${escapeAttr(url)}" target="_blank" style="color:#ff3b5c;text-decoration:underline;font-weight:600;">▶ Watch Video</a><br><iframe width="100%" height="150" src="https://www.youtube.com/embed/${escapeAttr(vidId)}" frameborder="0" allowfullscreen style="border-radius:8px;margin-top:4px;"></iframe></div>`);
        } else {
          txt = txt.replace(generalUrlRegex, function(url) {
            const cleanUrl = url.replace(/&amp;/g, '&');
            return `<a href="${cleanUrl}" target="_blank" rel="noopener noreferrer" style="color:#5ac8fa; text-decoration:underline; word-break:break-all; font-weight:500;">${url}</a>`;
          });
        }
        innerHtml = txt;
      }
      return `${innerHtml}<span class="msg-time">${timeStr}</span>`;
    }

    function renderMessages(messages) {
      const rm = document.getElementById('roomMessages');
      rm.innerHTML = messages.length ? messages.map(m => {
        const mine = currentUserData && m.senderCode === currentUserData.userCode;
        return `<div class="msg-bubble ${mine ? 'mine' : 'theirs'}" data-msgid="${escapeAttr(m.messageId)}" data-text="${escapeAttr(m.text)}" data-mine="${mine}">${formatMessageContent(m)}</div>`;
      }).join('') : '<div style="text-align:center;color:#777;padding:20px;">No messages yet.</div>';
      rm.scrollTop = rm.scrollHeight; 
      hydrateMediaCache(rm);

      document.querySelectorAll('.msg-bubble').forEach(bubble => {
        let timer;
        const msgId = bubble.getAttribute('data-msgid');
        const textVal = bubble.getAttribute('data-text');
        const isMine = bubble.getAttribute('data-mine') === 'true';

        const startMsgPress = () => { timer = setTimeout(() => { showMsgLongPressModal(msgId, textVal, isMine); }, 500); };
        const cancelMsgPress = () => clearTimeout(timer);

        bubble.addEventListener('mousedown', startMsgPress);
        bubble.addEventListener('touchstart', startMsgPress);
        bubble.addEventListener('mouseup', cancelMsgPress);
        bubble.addEventListener('mouseleave', cancelMsgPress);
        bubble.addEventListener('touchend', cancelMsgPress);
        bubble.addEventListener('touchmove', cancelMsgPress);
      });
    }

    function showMsgLongPressModal(msgId, textVal, isMine) {
      const existing = document.getElementById('msgLongPressModal');
      if (existing) existing.remove();

      const modal = document.createElement('div');
      modal.id = 'msgLongPressModal';
      modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:1600;display:flex;align-items:center;justify-content:center;padding:20px;';
      modal.onclick = () => modal.remove();

      let deleteEveryoneBtn = isMine ? `<button onclick="deleteMessageAction('${msgId}', 'everyone'); document.getElementById('msgLongPressModal').remove();" style="width:100%;background:transparent;border:0;color:#ff3b5c;padding:12px;text-align:left;font-size:14px;font-weight:600;cursor:pointer;border-radius:10px;">🗑️ Delete for Everyone</button>` : '';

      modal.innerHTML = `
        <div style="background:#171720;border:1px solid rgba(255,255,255,0.15);border-radius:20px;width:100%;max-width:300px;padding:16px;box-shadow:0 20px 50px rgba(0,0,0,0.9);" onclick="event.stopPropagation()">
          <button onclick="navigator.clipboard.writeText('${escapeAttr(textVal)}'); showToast('Text copied', 'success'); document.getElementById('msgLongPressModal').remove();" style="width:100%;background:transparent;border:0;color:#5ac8fa;padding:12px;text-align:left;font-size:14px;font-weight:600;cursor:pointer;border-radius:10px;">📋 Copy Text</button>
          <button onclick="deleteMessageAction('${msgId}', 'me'); document.getElementById('msgLongPressModal').remove();" style="width:100%;background:transparent;border:0;color:#ff9aae;padding:12px;text-align:left;font-size:14px;font-weight:600;cursor:pointer;border-radius:10px;">🗑️ Delete for Me</button>
          ${deleteEveryoneBtn}
        </div>`;
      document.body.appendChild(modal);
    }

    async function deleteMessageAction(msgId, type) {
      if (!currentChatTarget) return;
      const cached = await getMessagesLocal(currentChatTarget.userCode);
      const updated = cached.filter(m => m.messageId !== msgId);
      await saveMessagesLocal(currentChatTarget.userCode, updated);
      renderMessages(updated);
      showToast(type === 'everyone' ? 'Deleted for everyone' : 'Deleted for me', 'success');
    }

    function sendChatMessage() {
      const box = document.getElementById('msgInputBox'); 
      const val = box.innerText.trim();
      if (!val || !currentChatTarget) return;
      const clientMessageId = 'msg_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
      
      box.innerText = ''; 
      box.focus(); 

      // Always ensure authentication socket token is set before sending message
      if (currentUserData?.userCode) {
        socket.emit('set-socket-user', { userCode: currentUserData.userCode }, authRes => {
          if (authRes?.token) uploadToken = authRes.token;
          socket.emit('send-message', { targetCode: currentChatTarget.userCode, text: val, messageType: 'text', clientMessageId }, res => {
            if (res?.success) {
              syncCurrentChat(true);
            } else {
              showToast(res?.error || 'Failed to send message', 'error');
            }
          });
        });
      }
    }

    document.getElementById('msgInputBox').addEventListener('keydown', e => { 
      if (e.key === 'Enter' && !e.shiftKey) { 
        e.preventDefault(); 
        sendChatMessage(); 
      } 
    });

    function uploadFileWithProgress(file, onProgress) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest(); xhr.open('POST', '/api/upload-media');
        xhr.setRequestHeader('X-User-Code', currentUserData.userCode);
        xhr.setRequestHeader('X-Upload-Token', uploadToken || '');
        xhr.upload.onprogress = e => { if (e.lengthComputable && onProgress) onProgress(Math.round(e.loaded/e.total*100)); };
        xhr.onload = () => {
          try { const data = JSON.parse(xhr.responseText || '{}'); if (xhr.status>=200 && xhr.status<300 && data.success) resolve(data); else reject(new Error(data.error||'Upload failed')); }
          catch(e){ reject(new Error('Invalid response')); }
        };
        xhr.onerror = () => reject(new Error('Network error'));
        const form = new FormData(); form.append('media', file, file.name); xhr.send(form);
      });
    }

    async function sendMediaFile(inp) {
      const file = inp.files?.[0]; if (!file || !currentChatTarget) return;
      try {
        if (!uploadToken && currentUserData?.userCode) {
          await new Promise(r => socket.emit('set-socket-user', { userCode: currentUserData.userCode }, res => { uploadToken = res?.token || ''; r(); }));
        }
        const type = file.type.startsWith('image/') ? 'image' : file.type.startsWith('video/') ? 'video' : 'document';
        showToast('Uploading file...', 'info', 3000);
        const result = await uploadFileWithProgress(file);
        
        socket.emit('send-message', { targetCode: currentChatTarget.userCode, text: file.name, media: result.url, messageType: type, fileName: file.name }, res => {
          if (res?.success) {
            syncCurrentChat(true);
            showToast('File sent successfully', 'success');
          } else {
            showToast(res?.error || 'Failed to send file', 'error');
          }
        });
      } catch (e) { showToast(e.message || 'Upload failed', 'error'); }
      inp.value = '';
      document.getElementById('msgInputBox').focus(); 
    }

    socket.on('new-message', m => {
      if (!currentUserData) return;
      const sender = m.senderCode;
      const receiver = m.receiverCode;
      const otherCode = sender === currentUserData.userCode ? receiver : sender;

      if (currentChatTarget && currentChatTarget.userCode === otherCode) {
        syncCurrentChat(true);
      } else {
        unreadMap[otherCode] = (unreadMap[otherCode] || 0) + 1;
        renderContacts(globalContacts);
        showToast(`New message from ${otherCode}`, 'info', 2000);
      }
      syncContacts();
    });

    socket.on('status-updated', () => loadStatuses());

    async function loadStatuses(useLocal) {
      const local = await getStatusesLocal(); if (local && useLocal) renderStatuses(local);
      if (socket.connected) socket.emit('get-statuses');
    }
    socket.on('status-data', async data => { await saveStatusesLocal(data); renderStatuses(data); });

    function statusIsActive(item) { return !item?.expiresAt || new Date(item.expiresAt).getTime() > Date.now(); }

    let myActiveStatusesCount = 0;
    
    function handleMyStatusClick() {
      if (uploadingReelData) {
        openReelViewerForUser(currentUserData.userCode, 0, true);
      } else if (myActiveStatusesCount > 0) {
        openReelViewerForUser(currentUserData.userCode, 0, false);
      } else {
        document.getElementById('statusMediaInput').click();
      }
    }

    function renderStatuses(data) {
      const myArea = document.getElementById('myStatusArea'); const myRing = document.getElementById('myStatusRing'); const contacts = document.getElementById('contactStatusesArea');
      const myItems = (data?.myStatus?.items || []).filter(statusIsActive); myActiveStatusesCount = myItems.length;

      if (myArea && myRing) {
        if (uploadingReelData) {
          myArea.textContent = 'Posting reel... (Tap to preview)'; myArea.style.color = '#5ac8fa';
          myRing.innerHTML = `<img src="${escapeAttr(uploadingReelData.media)}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #5ac8fa;">`;
          myRing.style.border = 'none'; myRing.style.background = 'transparent';

          myArea.textContent = `${myItems.length} active reels (Tap to view)`; myArea.style.color = '#00ff88';
          myRing.innerHTML = `<img src="${escapeAttr(currentUserData?.avatar || DEFAULT_AVATAR)}" onerror="this.src='${DEFAULT_AVATAR}'" style="width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #00ff88;">`;
          myRing.style.border = 'none'; myRing.style.background = 'transparent';
        } else {
          myArea.textContent = 'Tap to post a reel'; myArea.style.color = '#7e7e92'; myRing.innerHTML = '+';
          myRing.style.border = '2px dashed #ff3b5c'; myRing.style.background = '#1c1c26';
        }
      }

      const arr = (data?.contactStatuses || []).map(s => ({...s, items: (s.items || []).filter(statusIsActive)})).filter(s => s.items.length);
      contacts.innerHTML = arr.length ? arr.map(s => `
        <div class="status-row" onclick="openReelViewerForUser('${escapeAttr(s.userCode)}', 0, false)">
          <div style="width:56px;height:56px;border-radius:50%;padding:2px;background:#00ff88;flex:none;">
            <img class="status-avatar-inner" src="${escapeAttr(s.avatar || DEFAULT_AVATAR)}" onerror="this.src='${DEFAULT_AVATAR}'">
          </div>
          <div>
            <div style="font-weight:700;">${escapeHtml(s.name || 'App User')}</div>
            <div style="font-size:12px;color:#7e7e92;">${s.items.length} reel(s)</div>
          </div>
        </div>`).join('') : '<div style="padding:20px;color:#7e7e92;text-align:center;">No recent reels</div>';
    }

    function uploadStatusMedia(inp) {
      const file = inp.files?.[0]; if (!file || !currentUserData) return;
      const tempPreviewUrl = URL.createObjectURL(file);
      const isVid = file.type.startsWith('video/');
      uploadingReelData = { media: tempPreviewUrl, type: isVid ? 'video' : 'image' };
      loadStatuses(true);

      uploadFileWithProgress(file).then(res => {
        const type = isVid ? 'video' : 'image';
        socket.emit('post-status', { id: 'status_' + Date.now(), media: res.url, type }, reply => {
          uploadingReelData = null; 
          if (reply?.success) { showToast('Reel posted successfully!', 'success'); loadStatuses(); }
          else { showToast(reply?.error || 'Failed to post', 'error'); loadStatuses(); }
          inp.value = '';
        });
      }).catch(e => {
        uploadingReelData = null;
        showToast(e.message || 'Upload failed', 'error'); loadStatuses(); inp.value = '';
      });
    }

    function deleteCurrentReel(statusId) {
      if (!confirm('Are you sure you want to delete this reel?')) return;
      socket.emit('delete-status', { statusId }, res => {
        if (res?.success) {
          showToast('Reel deleted successfully', 'success');
          loadStatuses(true);
        } else {
          showToast('Could not delete reel', 'error');
        }
      });
    }

    function openReelViewerForUser(userCode, itemIndex = 0, isUploading = false) {
      getStatusesLocal().then(data => {
        let items = [];
        let isMyReel = (userCode === currentUserData?.userCode);
        if (isUploading && uploadingReelData) {
          items = [uploadingReelData];
        } else {
          const user = isMyReel ? data?.myStatus : (data?.contactStatuses || []).find(s => s.userCode === userCode);
          items = (user?.items || []).filter(statusIsActive);
        }
        if (!items.length) return;

        let currentIndex = Math.max(0, Math.min(itemIndex, items.length - 1));

        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:1200;display:flex;align-items:center;justify-content:center;';

        const closeBtn = document.createElement('button');
        closeBtn.textContent = '✕';
        closeBtn.style.cssText = 'position:absolute;top:20px;right:20px;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.3);color:#fff;font-size:24px;width:40px;height:40px;border-radius:50%;cursor:pointer;z-index:1250;display:flex;align-items:center;justify-content:center;';
        closeBtn.onclick = (e) => { e.stopPropagation(); overlay.remove(); };
        overlay.appendChild(closeBtn);

        const deleteBtn = document.createElement('button');
        deleteBtn.innerHTML = '🗑️';
        deleteBtn.style.cssText = `position:absolute;top:20px;right:75px;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.3);color:#fff;font-size:18px;width:40px;height:40px;border-radius:50%;cursor:pointer;z-index:1250;display:${isMyReel && !isUploading ? 'flex' : 'none'};align-items:center;justify-content:center;`;
        deleteBtn.onclick = (e) => {
          e.stopPropagation();
          const currentItem = items[currentIndex];
          if (currentItem?.id) {
            deleteCurrentReel(currentItem.id);
            overlay.remove();
          }
        };
        overlay.appendChild(deleteBtn);

        const leftArrow = document.createElement('button');
        leftArrow.innerHTML = '❮';
        leftArrow.style.cssText = 'position:absolute;left:15px;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.3);color:#fff;font-size:24px;width:45px;height:45px;border-radius:50%;cursor:pointer;z-index:1250;display:flex;align-items:center;justify-content:center;';
        leftArrow.onclick = (e) => {
          e.stopPropagation();
          if (currentIndex > 0) {
            currentIndex--;
            updateMedia();
          }
        };
        overlay.appendChild(leftArrow);

        const rightArrow = document.createElement('button');
        rightArrow.innerHTML = '❯';
        rightArrow.style.cssText = 'position:absolute;right:15px;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.3);color:#fff;font-size:24px;width:45px;height:45px;border-radius:50%;cursor:pointer;z-index:1250;display:flex;align-items:center;justify-content:center;';
        rightArrow.onclick = (e) => {
          e.stopPropagation();
          if (currentIndex < items.length - 1) {
            currentIndex++;
            updateMedia();
          } else {
            overlay.remove();
          }
        };
        overlay.appendChild(rightArrow);

        const bottomCloseBtn = document.createElement('button');
        bottomCloseBtn.innerHTML = '▼ Close';
        bottomCloseBtn.style.cssText = 'position:absolute;bottom:40px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;cursor:pointer;z-index:1250;';
        bottomCloseBtn.onclick = (e) => { e.stopPropagation(); overlay.remove(); };
        overlay.appendChild(bottomCloseBtn);

        if (isUploading) {
          const badge = document.createElement('div');
          badge.textContent = 'Uploading Reel...';
          badge.style.cssText = 'position:absolute;top:25px;left:25px;background:#ff3b5c;color:#fff;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;z-index:1250;';
          overlay.appendChild(badge);
        }

        const container = document.createElement('div');
        container.style.cssText = 'position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;';
        
        const mediaElem = document.createElement(items[currentIndex].type === 'video' ? 'video' : 'img');
        mediaElem.controls = true; mediaElem.autoplay = true;
        mediaElem.style.cssText = 'max-width:100%;max-height:90vh;border-radius:12px;object-fit:contain;';
        container.appendChild(mediaElem);
        overlay.appendChild(container);

        async function updateMedia() {
          const currentItem = items[currentIndex];
          const localUrl = await cacheMediaUrl(currentItem.media);
          mediaElem.tagName === 'VIDEO' ? (mediaElem.src = localUrl || currentItem.media) : (mediaElem.src = localUrl || currentItem.media);
        }
        updateMedia();

        document.body.appendChild(overlay);
      });
    }

    function toggleChatRoomMenu(e) {
      e.stopPropagation();
      const m = document.getElementById('chatRoomMenu');
      m.style.display = m.style.display === 'block' ? 'none' : 'block';
    }

    async function clearCurrentChat() {
      if (!currentChatTarget) return;
      if (!confirm('Are you sure you want to clear this chat?')) return;
      await saveMessagesLocal(currentChatTarget.userCode, []);
      renderMessages([]);
      showToast('Chat cleared successfully', 'success');
      document.getElementById('chatRoomMenu').style.display = 'none';
    }

    function toggleAppMenu(e) { e.stopPropagation(); const m = document.getElementById('appMenu'); m.style.display = m.style.display === 'block' ? 'none' : 'block'; }
    
    document.addEventListener('click', (e) => {
      document.getElementById('appMenu').style.display = 'none';
      document.getElementById('chatRoomMenu').style.display = 'none';
      const forgotModal = document.getElementById('forgotModal');
      const profileModal = document.getElementById('myProfileModal');
      if (e.target === forgotModal) closeForgotModal();
      if (e.target === profileModal) closeMyProfile();
    });

    function openMyProfile() {
      document.getElementById('myProfileName').value = currentUserData.fullName || '';
      document.getElementById('myProfileId').textContent = currentUserData.userCode || '';
      document.getElementById('myProfileAvatar').src = currentUserData.avatar || DEFAULT_AVATAR;
      document.getElementById('myProfileModal').style.display = 'flex';
    }
    function closeMyProfile() { document.getElementById('myProfileModal').style.display = 'none'; }
    function saveMyProfile() {
      const fullName = document.getElementById('myProfileName').value.trim();
      const avatar = document.getElementById('myProfileAvatar').src;
      socket.emit('update-profile', { fullName, avatar }, res => {
        if (res?.success) { currentUserData = res.user; localStorage.setItem('chatAppUser', JSON.stringify(currentUserData)); closeMyProfile(); showToast('Saved', 'success'); }
      });
    }

    function loadCalls() { document.getElementById('callsList').innerHTML = 'Call history empty.'; }
    function logoutApp() {
      localStorage.removeItem('chatAppUser'); currentUserData = null;
      document.getElementById('mainApp').style.display = 'none';
      document.getElementById('screenAuth').style.display = 'flex';
      showToast('Logged out', 'success');
    }
  </script>
</body>
</html>
