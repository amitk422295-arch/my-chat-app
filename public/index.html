<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Chat App</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #08080c; color: #fff; height: 100vh; display: flex; flex-direction: column; }
    .screen { display: none; flex-direction: column; height: 100%; }
    .active-screen { display: flex; }
    
    /* Auth UI */
    .auth-container { flex: 1; display: flex; align-items: center; justify-content: center; }
    .glass-card { background: rgba(22, 22, 32, 0.9); padding: 24px; border-radius: 16px; width: 90%; max-width: 350px; display: flex; flex-direction: column; gap: 12px; }
    .input-box { width: 100%; padding: 12px; border-radius: 8px; background: #1c1c26; border: 1px solid #333; color: #fff; outline: none; }
    .btn { padding: 12px; border-radius: 8px; background: #ff3b5c; border: none; color: #fff; cursor: pointer; font-weight: bold; transition: 0.3s; }
    .btn:hover { box-shadow: 0 0 15px rgba(255, 59, 92, 0.7); }
    
    /* App UI */
    .header { display: flex; justify-content: space-between; padding: 16px; background: #121218; border-bottom: 1px solid #222; align-items: center; }
    .search-bar { padding: 8px; border-radius: 20px; border: none; background: #222; color: #fff; width: 60%; outline: none; text-align: center; }
    .menu-btn { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
    .typing-text { font-size: 12px; color: #00ff88; font-style: italic; display: none; }
    
    /* Ticks */
    .tick { font-size: 12px; margin-left: 6px; }
    .tick-sent { color: #888; }
    .tick-delivered { color: #bbb; }
    .tick-seen { color: #00ff88; text-shadow: 0 0 8px #00ff88; font-weight: bold; }
  </style>
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="authScreen" class="screen active-screen auth-container">
    <!-- Step 1 -->
    <div class="glass-card" id="step1">
      <h3>Step 1: Info</h3>
      <input type="text" id="regName" class="input-box" placeholder="Full Name">
      <input type="number" id="regPhone" class="input-box" placeholder="Phone (10 digits)">
      <select id="regGender" class="input-box">
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>
      <button class="btn" onclick="nextStep()">Next</button>
      <p style="text-align:center; font-size:12px; margin-top:10px; cursor:pointer;" onclick="showLogin()">Already have an account? Login</p>
    </div>

    <!-- Step 2 -->
    <div class="glass-card" id="step2" style="display:none;">
      <h3>Step 2: ID & Password</h3>
      <input type="text" id="regUserId" class="input-box" placeholder="User ID (e.g. @amit)">
      <input type="password" id="regPass" class="input-box" placeholder="Password (6-8 chars)" maxlength="8">
      <button class="btn" onclick="registerUser()">Submit</button>
    </div>

    <!-- Login -->
    <div class="glass-card" id="loginBox" style="display:none;">
      <h3>Login</h3>
      <input type="text" id="logUserId" class="input-box" placeholder="User ID">
      <input type="password" id="logPass" class="input-box" placeholder="Password">
      <button class="btn" onclick="loginUser()">Login</button>
    </div>
  </div>

  <!-- MAIN APP SCREEN -->
  <div id="mainApp" class="screen">
    <div class="header">
      <h3 id="chatTitle">Chats</h3>
      <input type="text" id="searchUser" class="search-bar" placeholder="Search ID or Phone..." onkeypress="if(event.key === 'Enter') search()">
      <button class="menu-btn" onclick="toggleMenu()">⋮</button>
    </div>
    
    <!-- 3 Dot Menu -->
    <div id="threeDotMenu" style="display:none; position:absolute; right:10px; top:60px; background:#222; padding:10px; border-radius:8px;">
      <p style="padding:8px; cursor:pointer;" onclick="editProfile()">Edit Profile</p>
      <p style="padding:8px; cursor:pointer;" onclick="alert('Block feature active')">Block User</p>
      <p style="padding:8px; cursor:pointer; color:#ff3b5c;" onclick="location.reload()">Logout</p>
    </div>

    <div id="chatMessages" style="flex:1; overflow-y:auto; padding:16px;"></div>
    
    <div style="padding:10px; background:#121218; display:flex;">
      <span id="typingIndicator" class="typing-text">typing...</span>
      <input type="text" id="msgInput" class="input-box" placeholder="Message..." oninput="handleTyping()" onkeypress="if(event.key === 'Enter') sendMsg()" style="flex:1;">
      <button class="btn" style="margin-left:10px;" onclick="sendMsg()">Send</button>
    </div>
  </div>

  <script>
    const socket = io();
    let myCode = '';
    let currentPartner = '';
    let typingTimer;

    // --- AUTH LOGIC ---
    function nextStep() {
      const phone = document.getElementById('regPhone').value;
      if (!/^[6-9]\d{9}$/.test(phone)) return alert("Enter valid 10-digit Indian Mobile Number");
      document.getElementById('step1').style.display = 'none';
      document.getElementById('step2').style.display = 'flex';
    }

    function showLogin() {
      document.getElementById('step1').style.display = 'none';
      document.getElementById('loginBox').style.display = 'flex';
    }

    function registerUser() {
      const uId = document.getElementById('regUserId').value;
      const pass = document.getElementById('regPass').value;
      if(!/^[a-z0-9]+$/.test(uId.replace('@',''))) return alert("User ID: Only lowercase letters and numbers allowed");
      if(pass.length < 6 || pass.length > 8) return alert("Password must be 6-8 characters long");

      socket.emit('auth-user', {
        isRegister: true, userCode: uId, password: pass,
        phone: document.getElementById('regPhone').value,
        fullName: document.getElementById('regName').value, gender: document.getElementById('regGender').value
      }, handleAuthResponse);
    }

    function loginUser() {
      socket.emit('auth-user', {
        isRegister: false, userCode: document.getElementById('logUserId').value,
        password: document.getElementById('logPass').value
      }, handleAuthResponse);
    }

    function handleAuthResponse(res) {
      if(res.success) {
        myCode = res.user.userCode;
        document.getElementById('authScreen').classList.remove('active-screen');
        document.getElementById('mainApp').classList.add('active-screen');
      } else alert(res.error);
    }

    // --- APP LOGIC ---
    function search() {
      const query = document.getElementById('searchUser').value;
      socket.emit('search-user', query, (res) => {
        if(res.success) {
          currentPartner = res.user.userCode;
          document.getElementById('chatTitle').innerText = res.user.fullName || currentPartner;
          socket.emit('open-room', { myCode, targetCode: currentPartner });
        } else alert("User not found in database.");
      });
    }

    function toggleMenu() {
      const menu = document.getElementById('threeDotMenu');
      menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
    }

    function handleTyping() {
      if(currentPartner) socket.emit('typing', { targetCode: currentPartner, userCode: myCode });
    }

    socket.on('user-typing', ({ userCode }) => {
      if (userCode === currentPartner) {
        const ind = document.getElementById('typingIndicator');
        ind.style.display = 'block';
        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => ind.style.display = 'none', 1500);
      }
    });

    function sendMsg() {
      const text = document.getElementById('msgInput').value;
      if(!text || !currentPartner) return;
      socket.emit('send-message', { senderCode: myCode, targetCode: currentPartner, text });
      document.getElementById('msgInput').value = '';
    }

    socket.on('chat-message', (msg) => {
      const div = document.createElement('div');
      div.id = `msg_${msg._id}`;
      const isMe = msg.senderCode === myCode;
      
      let ticks = '';
      if(isMe) {
        if(msg.status === 'sent') ticks = '<span class="tick tick-sent">✓</span>';
        if(msg.status === 'delivered') ticks = '<span class="tick tick-delivered">✓✓</span>';
        if(msg.status === 'seen') ticks = '<span class="tick tick-seen">✓✓</span>';
      }
      
      div.innerHTML = `<p style="background:${isMe ? '#ff3b5c' : '#222'}; padding:10px; border-radius:10px; margin:5px 0; width:fit-content; ${isMe ? 'margin-left:auto;' : ''}">${msg.text} ${ticks}</p>`;
      document.getElementById('chatMessages').appendChild(div);

      // Auto mark seen if I am receiving it
      if(!isMe && msg.status !== 'seen') {
        socket.emit('mark-seen', { id: msg._id, targetCode: msg.senderCode });
      }
    });

    socket.on('msg-seen', ({ id }) => {
      const msgDiv = document.getElementById(`msg_${id}`);
      if(msgDiv) msgDiv.innerHTML = msgDiv.innerHTML.replace(/tick-sent|tick-delivered/g, 'tick-seen');
    });

    socket.on('load-history', (msgs) => {
      document.getElementById('chatMessages').innerHTML = '';
      msgs.forEach(msg => {
         // Render logic is same as chat-message
         const div = document.createElement('div');
         const isMe = msg.senderCode === myCode;
         let ticks = isMe ? `<span class="tick tick-${msg.status}">${msg.status==='sent'?'✓':'✓✓'}</span>` : '';
         div.innerHTML = `<p style="background:${isMe ? '#ff3b5c' : '#222'}; padding:10px; border-radius:10px; margin:5px 0; width:fit-content; ${isMe ? 'margin-left:auto;' : ''}">${msg.text} ${ticks}</p>`;
         document.getElementById('chatMessages').appendChild(div);
      });
    });
  </script>
</body>
</html>
