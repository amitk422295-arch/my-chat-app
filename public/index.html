<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Complete Chat App</title>
  <meta name="theme-color" content="#08080c">
  <script src="/socket.io/socket.io.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { height: 100%; height: 100dvh; background: #08080c; color: #f0f2f5; overflow: hidden; }
    .bg-heart-pattern { position: fixed; inset: 0; pointer-events: none; opacity: 0.06; z-index: 0; background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="white"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>'); background-size: 54px 54px; }
    #toastBox { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1e1e2c; border: 1px solid rgba(255,255,255,0.15); padding: 12px 20px; border-radius: 30px; font-size: 13px; font-weight: 600; display: none; align-items: center; gap: 8px; z-index: 999; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    #toastBox.error { border-color: #ff3b5c; color: #ff6b8b; }
    #toastBox.success { border-color: #00c853; color: #00ff88; }
    #toastBox.info { border-color: #5ac8fa; color: #5ac8fa; }
    
    .screen-flow { position: fixed; inset: 0; background: radial-gradient(circle at top, #141420 0%, #08080c 100%); z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; overflow-y: auto; }
    .glass-card { width: 100%; max-width: 360px; background: rgba(22, 22, 32, 0.95); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.12); border-radius: 24px; padding: 26px 22px; display: flex; flex-direction: column; gap: 14px; text-align: center; box-shadow: 0 16px 40px rgba(0,0,0,0.6); }
    .input-box { width: 100%; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18); border-radius: 14px; padding: 12px 16px; color: #fff; font-size: 14px; outline: none; user-select: text; }
    .input-box:focus { border-color: #ff3b5c; background: rgba(255,255,255,0.12); }
    .btn-gradient { background: linear-gradient(135deg, #ff3b5c 0%, #ff6b8b 100%); color: #fff; border: none; padding: 13px; border-radius: 14px; font-weight: 600; font-size: 15px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(255,59,92,0.4); }
    .dp-circle { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; margin: 0 auto; background: #181822; border: 3px dashed #ff3b5c; cursor: pointer; }
    
    #mainApp { display: none; flex-direction: column; height: 100%; height: 100dvh; position: relative; z-index: 1; }
    .top-navbar { background: rgba(16,16,24,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.06); padding: 14px 18px 0; display: flex; flex-direction: column; gap: 10px; }
    .nav-tabs { display: flex; }
    .nav-tab { flex: 1; text-align: center; padding: 10px 0; font-size: 13px; font-weight: 700; color: #7e7e92; cursor: pointer; border-bottom: 2px solid transparent; }
    .nav-tab.active { color: #ff3b5c; border-bottom-color: #ff3b5c; }
    .top-actions { display:flex; align-items:center; gap:8px; }
    .icon-btn { width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:#191922;color:#fff;font-size:20px;cursor:pointer; }
    .menu-panel { position:fixed; top:62px; right:12px; width:250px; z-index:210; display:none; background:#171720; border:1px solid rgba(255,255,255,.12); border-radius:18px; padding:8px; box-shadow:0 20px 60px rgba(0,0,0,.75); }
    .menu-panel button { width:100%; border:0; background:transparent; color:#fff; padding:13px 12px; text-align:left; border-radius:12px; font-size:14px; cursor:pointer; }
    .menu-panel button:hover { background:rgba(255,255,255,.08); }
    .menu-panel .danger { color:#ff6b8b; }
    .modal { position:fixed; inset:0; z-index:220; display:none; align-items:center; justify-content:center; padding:18px; background:rgba(0,0,0,.76); }
    .modal-card { width:100%; max-width:390px; max-height:88vh; overflow:auto; background:#171720; border:1px solid rgba(255,255,255,.12); border-radius:24px; padding:22px; box-shadow:0 20px 70px rgba(0,0,0,.85); }
    .status-row { display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid rgba(255,255,255,.06); cursor:pointer; }
    .status-avatar { width:56px;height:56px;border-radius:50%;padding:3px;object-fit:cover;background:linear-gradient(135deg,#ff3b5c,#ff9aae); flex:none; }
    .status-avatar-inner { width:100%;height:100%;border-radius:50%;object-fit:cover;background:#222;display:block; }
    .panes-wrapper { flex: 1; position: relative; overflow: hidden; }
    .tab-pane { position: absolute; inset: 0; display: none; flex-direction: column; overflow-y: auto; background: #0c0c12; }
    .tab-pane.active { display: flex; }
    .chat-row { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,0.04); cursor: pointer; }
    .chat-row img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
    
    #chatRoom { position: fixed; inset: 0; background: #09090e; z-index: 60; display: none; flex-direction: column; }
    .bottom-input-bar { background: #121218; border-top: 1px solid rgba(255,255,255,0.06); padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
    .input-wrapper { flex: 1; display: flex; align-items: center; background: #1c1c26; border-radius: 24px; padding: 6px 14px; }
    .input-wrapper input { flex: 1; background: transparent; border: none; color: #fff; font-size: 15px; outline: none; }
    .btn-circle { width: 40px; height: 40px; border-radius: 50%; background: #ff3b5c; border: none; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    #roomMessages { display:flex; flex-direction:column; gap:6px; background:#0b0b11; }
    .msg-bubble { position:relative; max-width:78%; padding:9px 11px 5px; border-radius:12px; font-size:14px; line-height:1.4; word-break:break-word; white-space:pre-wrap; box-shadow:0 1px 2px rgba(0,0,0,.25); cursor:pointer; }
    .msg-bubble.mine { align-self:flex-end; background:#ff3b5c; border-bottom-right-radius:4px; }
    .msg-bubble.theirs { align-self:flex-start; background:#20202a; border-bottom-left-radius:4px; }
    .msg-time { display:block; text-align:right; font-size:9px; opacity:.7; margin-top:3px; }
    .profile-card { width:100%; max-width:360px; background:#171720; border:1px solid rgba(255,255,255,.12); border-radius:24px; padding:24px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.8); }
    .profile-card img { width:110px; height:110px; border-radius:50%; object-fit:cover; border:3px solid #ff3b5c; }
  </style>
</head>
<body>

  <div class="bg-heart-pattern"></div>
  <div id="toastBox"></div>

  <!-- AUTH SCREEN -->
  <div id="screenAuth" class="screen-flow">
    <div class="glass-card">
      <div style="font-size:34px;">💖</div>
      <h3 style="color:#fff;" id="authTitle">Create Account</h3>
      <p style="font-size:12px;color:#8a8a9e;" id="authSub">Register with Custom User ID</p>

      <!-- Register View -->
      <div id="viewRegister" style="display:flex; flex-direction:column; gap:12px;">
        <input type="file" id="dpFileInput" accept="image/*" style="display:none;" onchange="previewDp(this)">
        <img id="dpViewer" class="dp-circle" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90' fill='%23222'><text x='50%' y='55%' fill='%23888' font-size='11' text-anchor='middle'>Add DP</text></svg>" onclick="document.getElementById('dpFileInput').click()">
        <input type="text" id="regNameInput" class="input-box" placeholder="Your Name *">
        <input type="tel" id="regMobileInput" class="input-box" placeholder="Mobile Number *" maxlength="13">
        <input type="text" id="regUserIdInput" class="input-box" placeholder="User ID (e.g. @amit123)">
        <input type="password" id="regPassInput" class="input-box" placeholder="Compulsory 8-digit Password" maxlength="8">
        <button class="btn-gradient" type="button" onclick="handleRegisterCustom()">Register Now ➔</button>
      </div>

      <!-- Login View -->
      <div id="viewLogin" style="display:none; flex-direction:column; gap:12px;">
        <input type="text" id="loginIdInput" class="input-box" placeholder="User ID (@user) or Mobile">
        <input type="password" id="loginPassInput" class="input-box" placeholder="Password" maxlength="8">
        <button class="btn-gradient" type="button" onclick="handleLogin()">Login</button>
      </div>

      <p style="font-size:12px;color:#7e7e92;cursor:pointer;margin-top:6px;" onclick="toggleAuthMode()" id="authSwitchText">Already have an account? Login</p>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="mainApp">
    <div class="top-navbar">
      <div style="font-size:20px;font-weight:800;display:flex;justify-content:space-between;align-items:center;">
        <span>💖 Chat App</span>
        <div class="top-actions">
          <button class="icon-btn" onclick="loadContacts(); showToast('Chats refreshed','info')" aria-label="Refresh">↻</button>
          <button class="icon-btn" onclick="toggleAppMenu(event)" aria-label="Menu">⋮</button>
        </div>
      </div>
      <div class="nav-tabs">
        <div class="nav-tab active" onclick="switchTab('paneChats', this)">CHATS</div>
        <div class="nav-tab" onclick="switchTab('paneStatus', this); loadStatuses();">STATUS</div>
        <div class="nav-tab" onclick="switchTab('paneCalls', this); loadCalls();">CALLS</div>
      </div>
    </div>

    <div class="panes-wrapper">
      <div class="tab-pane active" id="paneChats">
        <div style="padding:12px;display:flex;gap:8px;">
          <input type="text" id="directSearchInput" class="input-box" placeholder="Search/Open @userid or mobile">
          <button class="btn-gradient" onclick="openDirectChat()">Chat</button>
        </div>
        <div id="chatsList"></div>
      </div>

      <div class="tab-pane" id="paneStatus">
        <div style="padding:16px;">
          <input type="file" id="statusMediaInput" accept="image/*,video/*" style="display:none;" onchange="uploadStatusMedia(this)">
          <div id="myStatusArea" style="margin-bottom:12px;font-weight:600;font-size:14px;"></div>
          <button class="btn-gradient" style="width:100%;margin-bottom:12px;" onclick="document.getElementById('statusMediaInput').click()">＋ Add Status</button>
          <div id="contactStatusesArea"></div>
        </div>
      </div>

      <div class="tab-pane" id="paneCalls">
        <div id="callsList" style="padding:16px;">Loading call history...</div>
      </div>
    </div>
  </div>

  <!-- THREE-DOT APP MENU -->
  <div id="appMenu" class="menu-panel" onclick="event.stopPropagation()">
    <button onclick="openMyProfile()">👤 My Profile</button>
    <button onclick="openSettings()">⚙️ Settings</button>
    <button class="danger" onclick="logoutApp()">🚪 Logout</button>
  </div>

  <div id="myProfileModal" class="modal" onclick="if(event.target===this)closeMyProfile()">
    <div class="modal-card">
      <h3 style="text-align:center;margin-bottom:14px;">My Profile</h3>
      <img id="myProfileAvatar" class="profile-edit-avatar" src="" style="width:90px;height:90px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 12px;border:3px solid #ff3b5c;">
      <input id="myProfileName" class="input-box" placeholder="Full Name">
      <div id="myProfileId" style="font-size:12px;color:#888;margin:10px 0;text-align:center"></div>
      <button class="btn-gradient" style="width:100%" onclick="saveMyProfile()">Save Profile</button>
      <button class="icon-btn" style="margin:12px auto 0;display:block" onclick="closeMyProfile()">×</button>
    </div>
  </div>

  <!-- CHAT ROOM UI -->
  <div id="chatRoom">
    <div style="padding:14px;background:#121218;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,0.06);">
      <button onclick="closeChatRoom()" style="background:transparent;border:none;color:#fff;font-size:18px;">←</button>
      <img id="roomUserAvatar" src="" style="width:40px;height:40px;border-radius:50%;object-fit:cover;">
      <div style="flex:1;">
        <div id="roomUserName" style="font-weight:700;font-size:15px;">User</div>
        <div id="roomUserStatus" style="font-size:11px;color:#00ff88;">Offline</div>
      </div>
    </div>
    <div id="roomMessages" style="flex:1;overflow-y:auto;padding:14px;"></div>
    <div class="bottom-input-bar">
      <div class="input-wrapper">
        <input type="text" id="msgInputBox" placeholder="Type a message...">
      </div>
      <button class="btn-circle" onclick="sendChatMessage()">➤</button>
    </div>
  </div>

  <script>
    const socket = io();
    let authMode = 'reg';
    let regDpBase64 = '';
    let currentUserData = null;
    let currentChatTarget = null;

    function showToast(msg, type='info') {
      const t = document.getElementById('toastBox');
      t.className = type; t.textContent = msg; t.style.display = 'flex';
      setTimeout(()=> { if(t) t.style.display='none'; }, 3500);
    }

    function toggleAuthMode() {
      const loginView = document.getElementById('viewLogin');
      const regView = document.getElementById('viewRegister');
      const title = document.getElementById('authTitle');
      const sub = document.getElementById('authSub');
      const switchText = document.getElementById('authSwitchText');

      if (authMode === 'login') {
        authMode = 'reg';
        title.textContent = 'Create Account';
        sub.textContent = 'Register with Custom User ID';
        loginView.style.display = 'none'; regView.style.display = 'flex';
        switchText.textContent = 'Already have an account? Login';
      } else {
        authMode = 'login';
        title.textContent = 'Welcome Back';
        sub.textContent = 'Existing user? Login here';
        regView.style.display = 'none'; loginView.style.display = 'flex';
        switchText.textContent = 'New here? Register Account';
      }
    }

    function previewDp(inp) {
      const file = inp.files && inp.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => { regDpBase64 = e.target.result; document.getElementById('dpViewer').src = regDpBase64; };
      reader.readAsDataURL(file);
    }

    function handleRegisterCustom() {
      const name = document.getElementById('regNameInput').value.trim();
      const mobile = document.getElementById('regMobileInput').value.trim().replace(/[\s-+]/g, '');
      const userId = document.getElementById('regUserIdInput').value.trim().toLowerCase();
      const pass = document.getElementById('regPassInput').value.trim();

      if (!name || mobile.length < 10) { showToast('Valid name & 10+ digit mobile required', 'error'); return; }
      if (!userId.startsWith('@') || userId.length < 5) { showToast('User ID must start with @ and have 4+ characters', 'error'); return; }
      if (pass.length !== 8) { showToast('Password must be strictly 8 digits', 'error'); return; }

      showToast('Creating account...', 'info');
      socket.emit('register-custom', {
        userCode: userId, password: pass, fullName: name, mobile, avatar: regDpBase64
      }, res => {
        if (res && res.success) {
          currentUserData = res.user;
          showToast('Registration successful!', 'success');
          launchMainApp();
        } else {
          showToast(res?.error || 'Registration failed', 'error');
        }
      });
    }

    function handleLogin() {
      const id = document.getElementById('loginIdInput').value.trim();
      const pass = document.getElementById('loginPassInput').value.trim();
      if(!id || !pass) { showToast('Enter ID/Mobile and Password', 'error'); return; }
      showToast('Logging in...', 'info');

      socket.emit('auth-user', { userCode: id, password: pass }, res => {
        if (res && res.success) {
          currentUserData = res.user;
          showToast('Welcome back!', 'success');
          launchMainApp();
        } else {
          showToast(res?.error || 'Invalid credentials', 'error');
        }
      });
    }

    function launchMainApp() {
      document.getElementById('screenAuth').style.display = 'none';
      document.getElementById('mainApp').style.display = 'flex';
      loadContacts();
    }

    function switchTab(paneId, tabEl) {
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      document.getElementById(paneId).classList.add('active');
      tabEl.classList.add('active');
    }

    function loadContacts() { socket.emit('get-contacts'); }

    socket.on('contact-list-data', ({ contacts }) => {
      const list = document.getElementById('chatsList');
      list.innerHTML = contacts.length ? contacts.map(c => `
        <div class="chat-row" onclick="openChatWith('${c.userCode}', '${c.name}', '${c.avatar || ''}')">
          <img src="${c.avatar || 'data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'50\' height=\'50\' fill=\'%23333\'><circle cx=\'25\' cy=\'25\' r=\'25\'/></svg>'}">
          <div>
            <div style="font-weight:700;">${c.name}</div>
            <div style="font-size:12px;color:#7e7e92;">${c.userCode}</div>
          </div>
        </div>
      `).join('') : '<div style="padding:20px;color:#7e7e92;text-align:center;">No other users found yet.</div>';
    });

    function openDirectChat() {
      const query = document.getElementById('directSearchInput').value.trim();
      if (!query) return;
      socket.emit('open-direct-chat', { targetCode: query, query }, res => {
        if (res.success) openChatWith(res.user.userCode, res.user.fullName, res.user.avatar);
        else showToast(res.error, 'error');
      });
    }

    function openChatWith(uCode, name, avatar) {
      currentChatTarget = { userCode: uCode, name, avatar };
      document.getElementById('roomUserName').textContent = name || 'User';
      document.getElementById('roomUserAvatar').src = avatar || '';
      document.getElementById('roomMessages').innerHTML = '<div style="text-align:center;color:#777;font-size:12px;padding:20px;">Loading messages...</div>';
      document.getElementById('chatRoom').style.display = 'flex';
      socket.emit('get-messages', { targetCode: uCode }, res => {
        if (!res?.success) { showToast(res?.error || 'Could not load messages', 'error'); return; }
        renderMessages(res.messages || []);
      });
    }

    function closeChatRoom() {
      document.getElementById('chatRoom').style.display = 'none';
      currentChatTarget = null;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>\"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '\"':'&quot;', "'":'&#39;' }[ch]));
    }

    function renderMessages(messages) {
      const rm = document.getElementById('roomMessages');
      if (!messages.length) {
        rm.innerHTML = '<div style="text-align:center;color:#777;font-size:12px;padding:30px;">No messages yet. Say hello 👋</div>';
        return;
      }
      rm.innerHTML = messages.map(m => {
        const mine = currentUserData && m.senderCode === currentUserData.userCode;
        return `<div class="msg-bubble ${mine ? 'mine' : 'theirs'}">${escapeHtml(m.text)}<span class="msg-time">${new Date(m.createdAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span></div>`;
      }).join('');
      rm.scrollTop = rm.scrollHeight;
    }

    function sendChatMessage() {
      const box = document.getElementById('msgInputBox');
      const val = box.value.trim();
      if (!val || !currentChatTarget) return;
      box.value = '';
      socket.emit('send-message', { targetCode: currentChatTarget.userCode, text: val }, res => {
        if (!res?.success) { box.value = val; showToast(res?.error || 'Message failed', 'error'); }
      });
    }

    document.getElementById('msgInputBox').addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); sendChatMessage(); }
    });

    socket.on('new-message', m => {
      if (!currentUserData) return;
      const related = (m.senderCode === currentUserData.userCode && currentChatTarget?.userCode === m.receiverCode) ||
                      (m.receiverCode === currentUserData.userCode && currentChatTarget?.userCode === m.senderCode);
      if (related) {
        const rm = document.getElementById('roomMessages');
        rm.insertAdjacentHTML('beforeend', `<div class="msg-bubble ${m.senderCode === currentUserData.userCode ? 'mine' : 'theirs'}">${escapeHtml(m.text)}<span class="msg-time">${new Date(m.createdAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span></div>`);
        rm.scrollTop = rm.scrollHeight;
      }
    });

    function toggleAppMenu(e){ if(e)e.stopPropagation(); const m=document.getElementById('appMenu'); m.style.display=m.style.display==='block'?'none':'block'; }
    function closeAppMenu(){ document.getElementById('appMenu').style.display='none'; }
    document.addEventListener('click', e=>{ if(!e.target.closest('#appMenu') && !e.target.closest('.icon-btn')) closeAppMenu(); });
    function openMyProfile(){ closeAppMenu(); if(!currentUserData)return; document.getElementById('myProfileName').value=currentUserData.fullName||''; document.getElementById('myProfileId').textContent=currentUserData.userCode||''; document.getElementById('myProfileAvatar').src=currentUserData.avatar||''; document.getElementById('myProfileModal').style.display='flex'; }
    function closeMyProfile(){ document.getElementById('myProfileModal').style.display='none'; }
    function saveMyProfile(){ const fullName=document.getElementById('myProfileName').value.trim(); const avatar=document.getElementById('myProfileAvatar').src||''; socket.emit('update-profile',{fullName,avatar},res=>{ if(res?.success){currentUserData=res.user; closeMyProfile(); loadContacts(); showToast('Profile saved','success');} else showToast(res?.error||'Could not save profile','error'); }); }
    function logoutApp(){ closeAppMenu(); currentChatTarget=null; currentUserData=null; document.getElementById('mainApp').style.display='none'; document.getElementById('chatRoom').style.display='none'; document.getElementById('screenAuth').style.display='flex'; showToast('Logged out','success'); }
  </script>
</body>
</html>
