<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Chat App</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #08080c; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .screen { display: none; flex-direction: column; height: 100%; }
    .active-screen { display: flex; }
    
    /* Original Auth Theme with DP preview matching screenshot */
    .auth-container { flex: 1; display: flex; align-items: center; justify-content: center; background: #08080c; overflow-y: auto; padding: 20px; }
    .glass-card { background: rgba(22, 22, 32, 0.95); padding: 24px; border-radius: 16px; width: 90%; max-width: 350px; display: flex; flex-direction: column; gap: 12px; border: 1px solid #222; }
    .input-box { width: 100%; padding: 12px; border-radius: 8px; background: #1c1c26; border: 1px solid #333; color: #fff; outline: none; }
    .btn { padding: 12px; border-radius: 8px; background: #ff3b5c; border: none; color: #fff; cursor: pointer; font-weight: bold; transition: 0.3s; }
    .btn:hover { box-shadow: 0 0 15px rgba(255, 59, 92, 0.7); }
    .dp-circle { width: 90px; height: 90px; border-radius: 50%; border: 2px dashed #ff3b5c; margin: 0 auto; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; background: #1c1c26; position: relative; }
    .dp-circle img { width: 100%; height: 100%; object-fit: cover; }

    /* Main App Custom Theme (#08080c background & #ff3b5c highlights) */
    .app-main { display: flex; flex-direction: column; height: 100vh; background: #08080c; }
    .app-header { display: flex; justify-content: space-between; padding: 14px 16px; background: #121218; border-bottom: 1px solid #222; align-items: center; }
    
    .nav-tabs { display: flex; background: #121218; border-bottom: 1px solid #222; }
    .nav-tab { flex: 1; text-align: center; padding: 12px; color: #888; font-weight: bold; cursor: pointer; font-size: 13px; border-bottom: 3px solid transparent; }
    .nav-tab.active { color: #ff3b5c; border-bottom-color: #ff3b5c; }

    .pane-content { flex: 1; overflow-y: auto; display: none; padding: 12px; }
    .pane-content.active { display: block; }

    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #1c1c26; cursor: pointer; border-radius: 8px; margin-bottom: 6px; background: #121218; }
    .list-item:hover { background: #1c1c26; }

    /* Chat Room Screen */
    #chatRoomScreen { display: none; flex-direction: column; height: 100vh; background: #08080c; position: absolute; inset: 0; z-index: 50; }
    .chat-top-bar { background: #121218; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #222; }
    .msg-bubble { background: #1c1c26; padding: 10px 14px; border-radius: 10px; margin: 6px 0; max-width: 75%; width: fit-content; font-size: 14px; position: relative; cursor: pointer; }
    .msg-bubble.me { background: #ff3b5c; margin-left: auto; }
    
    /* 3-Dot Menu */
    #dropdownMenu { display: none; position: absolute; right: 15px; top: 60px; background: #1c1c26; border: 1px solid #333; border-radius: 8px; z-index: 100; width: 150px; }
    #dropdownMenu div { padding: 10px 14px; font-size: 13px; cursor: pointer; border-bottom: 1px solid #222; }
    #dropdownMenu div:hover { background: #252533; }

    /* Big DP Modal */
    #bigDpModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; align-items: center; justify-content: center; flex-direction: column; gap: 15px; }
    #bigDpModal img { width: 280px; height: 280px; border-radius: 50%; object-fit: cover; border: 3px solid #ff3b5c; }

    /* Edit Profile Modal */
    #editProfileModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; align-items: center; justify-content: center; }
  </style>
</head>
<body>

  <!-- AUTH SCREEN (Exact match reference layout + DP sync) -->
  <div id="authScreen" class="screen active-screen auth-container">
    <div class="glass-card">
      <div style="text-align:center;">
        <span style="font-size:24px;">💖✨</span>
        <h3 style="color:#fff; margin-top:8px;">Create Account</h3>
        <p style="font-size:11px; color:#888;">Session remains saved even after refresh</p>
      </div>
      
      <div class="dp-circle" onclick="document.getElementById('dpFileReg').click()" id="regDpPreview">
        <span style="font-size:12px; color:#888; text-align:center;">Tap to Set Profile DP *</span>
      </div>
      <input type="file" id="dpFileReg" style="display:none;" accept="image/*" onchange="previewDp(event, 'regDpPreview')">

      <input type="text" id="regName" class="input-box" placeholder="Test y" value="Test y">
      <input type="text" id="regUserId" class="input-box" placeholder="@test453">
      <input type="password" id="regPass" class="input-box" placeholder="Password">
      <input type="text" id="regPhone" class="input-box" placeholder="Phone Number">
      <button class="btn" onclick="authAction(true)">Register & Start</button>
      <p style="text-align:center; font-size:12px; color:#ff3b5c; cursor:pointer;" onclick="toggleAuthMode(false)">Already have an ID? Login here</p>
    </div>
  </div>

  <!-- LOGIN CONTAINER (Hidden by default, toggled) -->
  <div id="loginScreen" class="screen auth-container" style="display:none;">
    <div class="glass-card">
      <h3 style="color:#ff3b5c; text-align:center;">Login</h3>
      <input type="text" id="logUserId" class="input-box" placeholder="User ID (@...)">
      <input type="password" id="logPass" class="input-box" placeholder="Password">
      <button class="btn" onclick="authAction(false)">Login</button>
      <p style="text-align:center; font-size:12px; color:#888; cursor:pointer;" onclick="toggleAuthMode(true)">Create new account</p>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="mainApp" class="screen app-main">
    <div class="app-header">
      <span style="font-weight:bold; color:#ff3b5c; font-size:18px;" id="profileHeaderName">Messenger</span>
      <div style="position:relative;">
        <button onclick="toggleMenu()" style="background:none; border:none; color:#fff; font-size:22px; cursor:pointer;">⋮</button>
        <div id="dropdownMenu">
          <div onclick="searchAndAddContact()">Add Contact</div>
          <div onclick="openEditProfile()">Edit Profile</div>
          <div onclick="location.reload()" style="color:#ff3b5c;">Logout</div>
        </div>
      </div>
    </div>

    <div class="nav-tabs">
      <div class="nav-tab active" onclick="switchTab('chats')">CHATS</div>
      <div class="nav-tab" onclick="switchTab('status')">STATUS (24H)</div>
      <div class="nav-tab" onclick="switchTab('calls')">CALLS</div>
    </div>

    <!-- CHATS PANE -->
    <div id="pane-chats" class="pane-content active">
      <div id="contactsList"></div>
    </div>

    <!-- STATUS PANE -->
    <div id="pane-status" class="pane-content">
      <div style="margin-bottom:15px; display:flex; gap:10px;">
        <input type="text" id="statusInput" class="input-box" placeholder="Post 24hr status...">
        <button class="btn" onclick="postStatus()">Post</button>
      </div>
      <div id="statusList"></div>
    </div>

    <!-- CALLS PANE -->
    <div id="pane-calls" class="pane-content">
      <div id="callLogsList"></div>
    </div>
  </div>

  <!-- CHAT ROOM SCREEN -->
  <div id="chatRoomScreen" class="screen">
    <div class="chat-top-bar">
      <div style="display:flex; align-items:center; gap:12px;">
        <button onclick="closeChat()" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">←</button>
        <img id="chatPartnerDp" src="" style="width:36px; height:36px; border-radius:50%; object-fit:cover; cursor:pointer; background:#333;" onclick="showBigDp(currentPartnerDpUrl, currentPartnerName)">
        <h4 id="chatRoomTitle" style="cursor:pointer;" onclick="showBigDp(currentPartnerDpUrl, currentPartnerName)">Chat</h4>
      </div>
      <button onclick="simulateAudioCall()" style="background:none; border:none; color:#ff3b5c; font-size:20px; cursor:pointer;" title="Audio Call">📞</button>
    </div>

    <div id="chatMessagesArea" style="flex:1; overflow-y:auto; padding:16px;"></div>

    <div style="padding:10px; background:#121218; display:flex; gap:10px;">
      <input type="text" id="msgInputBox" class="input-box" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMsg()">
      <button class="btn" onclick="sendMsg()">Send</button>
    </div>
  </div>

  <!-- BIG DP MODAL -->
  <div id="bigDpModal" onclick="this.style.display='none'">
    <img id="bigDpImg" src="" alt="DP">
    <h3 id="bigDpName" style="color:#fff;"></h3>
    <small style="color:#aaa;">Tap anywhere to close</small>
  </div>

  <!-- EDIT PROFILE MODAL -->
  <div id="editProfileModal">
    <div class="glass-card" style="width:90%; max-width:350px;">
      <h3>Edit Profile</h3>
      <div class="dp-circle" onclick="document.getElementById('dpFileEdit').click()" id="editDpPreview">
        <span>Change DP</span>
      </div>
      <input type="file" id="dpFileEdit" style="display:none;" accept="image/*" onchange="previewDp(event, 'editDpPreview')">
      <input type="text" id="editName" class="input-box" placeholder="Name">
      <input type="text" id="editPhone" class="input-box" placeholder="Phone">
      <button class="btn" onclick="saveProfileChanges()">Save Changes</button>
      <button class="btn" style="background:#1c1c26;" onclick="document.getElementById('editProfileModal').style.display='none'">Cancel</button>
    </div>
  </div>

  <script>
    const socket = io();
    let myCode = '';
    let currentUserData = {};
    let currentPartner = '';
    let currentPartnerName = '';
    let currentPartnerDpUrl = '';
    let regDpDataUrl = '';
    let editDpDataUrl = '';
    let callStartTime = 0;

    function previewDp(event, previewId) {
      const file = event.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const url = e.target.result;
        document.getElementById(previewId).innerHTML = `<img src="${url}" />`;
        if(previewId === 'regDpPreview') regDpDataUrl = url;
        if(previewId === 'editDpPreview') editDpDataUrl = url;
      };
      reader.readAsDataURL(file);
    }

    function toggleAuthMode(toRegister) {
      document.getElementById('authScreen').style.display = toRegister ? 'flex' : 'none';
      document.getElementById('loginScreen').style.display = toRegister ? 'none' : 'flex';
    }

    function authAction(isRegister) {
      let userCode, password, phone, fullName, avatar;
      if(isRegister) {
        userCode = document.getElementById('regUserId').value.trim();
        password = document.getElementById('regPass').value;
        phone = document.getElementById('regPhone').value.trim();
        fullName = document.getElementById('regName').value.trim() || 'Test y';
        avatar = regDpDataUrl;
      } else {
        userCode = document.getElementById('logUserId').value.trim();
        password = document.getElementById('logPass').value;
      }
      if(!userCode || !password) return alert("Fill ID & Password");

      socket.emit('auth-user', { isRegister, userCode, password, phone, fullName, avatar }, res => {
        if(res.success) {
          currentUserData = res.user;
          myCode = res.user.userCode;
          document.getElementById('authScreen').style.display = 'none';
          document.getElementById('loginScreen').style.display = 'none';
          document.getElementById('mainApp').classList.add('active-screen');
          document.getElementById('profileHeaderName').innerText = myCode;
          loadContacts();
        } else alert(res.error);
      });
    }

    function openEditProfile() {
      toggleMenu();
      document.getElementById('editName').value = currentUserData.fullName || '';
      document.getElementById('editPhone').value = currentUserData.phone || '';
      if(currentUserData.avatar) {
        document.getElementById('editDpPreview').innerHTML = `<img src="${currentUserData.avatar}" />`;
      }
      document.getElementById('editProfileModal').style.display = 'flex';
    }

    function saveProfileChanges() {
      const fullName = document.getElementById('editName').value;
      const phone = document.getElementById('editPhone').value;
      socket.emit('update-profile', { userCode: myCode, fullName, phone, avatar: editDpDataUrl }, res => {
        if(res.success) {
          currentUserData = res.user;
          document.getElementById('editProfileModal').style.display = 'none';
          loadContacts();
          alert('Profile updated!');
        }
      });
    }

    function showBigDp(url, name) {
      document.getElementById('bigDpImg.src', url || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="%23333"/><text x="50%" y="50%" fill="%23aaa" font-size="40" dominant-baseline="middle" text-anchor="middle">?</text></svg>');
      document.getElementById('bigDpImg').src = url || 'https://via.placeholder.com/280';
      document.getElementById('bigDpName').innerText = name;
      document.getElementById('bigDpModal').style.display = 'flex';
    }

    function switchTab(tab) {
      document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.pane-content').forEach(el => el.classList.remove('active'));
      if(tab === 'chats') { document.querySelectorAll('.nav-tab')[0].classList.add('active'); document.getElementById('pane-chats').classList.add('active'); loadContacts(); }
      if(tab === 'status') { document.querySelectorAll('.nav-tab')[1].classList.add('active'); document.getElementById('pane-status').classList.add('active'); loadStatuses(); }
      if(tab === 'calls') { document.querySelectorAll('.nav-tab')[2].classList.add('active'); document.getElementById('pane-calls').classList.add('active'); loadCalls(); }
    }

    function toggleMenu() {
      const menu = document.getElementById('dropdownMenu');
      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    }

    function searchAndAddContact() {
      toggleMenu();
      const target = prompt("Enter User ID or Phone to chat:");
      if(!target) return;
      socket.emit('search-user', { query: target }, res => {
        if(res.success) {
          socket.emit('add-contact', { myCode, targetCode: res.user.userCode }, () => loadContacts());
          openChat(res.user.userCode, res.user.name, res.user.avatar);
        } else alert(res.error);
      });
    }

    function loadContacts() {
      socket.emit('get-contacts', { myCode }, res => {
        const div = document.getElementById('contactsList');
        div.innerHTML = res.contacts.map(c => `
          <div class="list-item" onclick="openChat('${c.userCode}', '${c.name.replace(/'/g, "\\'")}', '${c.avatar || ''}')">
            <div style="display:flex; align-items:center; gap:10px;">
              <img src="${c.avatar || 'https://via.placeholder.com/45'}" style="width:45px; height:45px; border-radius:50%; object-fit:cover; background:#333;" onclick="event.stopPropagation(); showBigDp('${c.avatar || ''}', '${c.name.replace(/'/g, "\\'")}')">
              <div><strong>${c.name}</strong><br><small style="color:#888;">${c.userCode}</small></div>
            </div>
            <span style="color:#ff3b5c; font-size:13px;">Chat →</span>
          </div>
        `).join('') || '<p style="color:#888; text-align:center; margin-top:20px;">No chats yet. Click ⋮ -> Add Contact</p>';
      });
    }

    function openChat(code, name, avatar) {
      currentPartner = code;
      currentPartnerName = name;
      currentPartnerDpUrl = avatar;
      document.getElementById('mainApp').classList.remove('active-screen');
      document.getElementById('chatRoomScreen').classList.add('active-screen');
      document.getElementById('chatRoomTitle').innerText = name;
      document.getElementById('chatPartnerDp').src = avatar || 'https://via.placeholder.com/36';
      socket.emit('open-room', { myCode, targetCode: code }, res => renderMsgs(res.msgs));
    }

    function closeChat() {
      document.getElementById('chatRoomScreen').classList.remove('active-screen');
      document.getElementById('mainApp').classList.add('active-screen');
      loadContacts();
    }

    function sendMsg() {
      const text = document.getElementById('msgInputBox').value.trim();
      if(!text || !currentPartner) return;
      socket.emit('send-message', { senderCode: myCode, targetCode: currentPartner, text });
      document.getElementById('msgInputBox').value = '';
    }

    socket.on('chat-message', (msg) => {
      if(msg.senderCode === currentPartner || msg.targetCode === currentPartner) appendBubble(msg);
    });

    function appendBubble(m) {
      const area = document.getElementById('chatMessagesArea');
      const isMe = m.senderCode === myCode;
      area.innerHTML += `
        <div class="msg-bubble ${isMe ? 'me' : ''}" id="msg_${m._id}" onclick="showDeleteOptions('${m._id}', ${isMe})">
          <div>${m.text}</div>
          <div style="font-size:10px; color:#aaa; text-align:right; margin-top:2px;">${m.time}</div>
        </div>
      `;
      area.scrollTop = area.scrollHeight;
    }

    function renderMsgs(msgs) {
      const area = document.getElementById('chatMessagesArea');
      area.innerHTML = '';
      msgs.forEach(m => appendBubble(m));
    }

    function showDeleteOptions(id, isMe) {
      const choice = confirm("Delete message? OK for Delete for Me, Cancel for exit.");
      if(choice) {
        socket.emit('delete-msg', { msgId: id, type: 'me', myCode });
        document.getElementById(`msg_${id}`).remove();
      }
    }

    socket.on('msg-deleted', (updated) => {
      const el = document.getElementById(`msg_${updated._id}`);
      if(el) el.innerHTML = `<div>${updated.text}</div>`;
    });

    function postStatus() {
      const text = document.getElementById('statusInput').value.trim();
      if(!text) return;
      socket.emit('post-status', { userCode: myCode, text }, () => {
        document.getElementById('statusInput').value = '';
        loadStatuses();
      });
    }

    function loadStatuses() {
      socket.emit('get-statuses', res => {
        document.getElementById('statusList').innerHTML = res.statuses.map(s => `
          <div style="background:#121218; padding:12px; border-radius:8px; margin-bottom:8px; border-left:3px solid #ff3b5c;">
            <strong style="color:#ff3b5c;">${s.userCode}</strong>
            <p style="margin-top:4px; font-size:14px;">${s.text}</p>
            <small style="color:#888;">Expires in 24 hours</small>
          </div>
        `).join('') || '<p style="color:#888;">No active statuses.</p>';
      });
    }

    function simulateAudioCall() {
      callStartTime = Date.now();
      const confirmed = confirm(`Calling ${currentPartner}... Click OK to end and save call log.`);
      const durationSec = Math.round((Date.now() - callStartTime) / 1000);
      const durationStr = `${Math.floor(durationSec/60)}m ${durationSec%60}s`;
      socket.emit('log-call', { caller: myCode, receiver: currentPartner, duration: durationStr });
      alert(`Call ended. Duration: ${durationStr}`);
    }

    function loadCalls() {
      socket.emit('get-calls', { myCode }, res => {
        document.getElementById('callLogsList').innerHTML = res.logs.map(l => `
          <div class="list-item">
            <div>
              <strong>${l.caller === myCode ? 'Outgoing to ' + l.receiver : 'Incoming from ' + l.caller}</strong>
              <br><small style="color:#888;">Audio call • Duration: ${l.duration} • ${l.time}</small>
            </div>
          </div>
        `).join('') || '<p style="color:#888; text-align:center; margin-top:20px;">No recent calls.</p>';
      });
    }
  </script>
</body>
</html>
