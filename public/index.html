<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat App Login</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #08080c; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 20px; }
    .card { width: 100%; max-width: 350px; background: #161620; padding: 24px; border-radius: 20px; text-align: border; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .input-box { width: 100%; background: #222230; border: 1px solid #333344; border-radius: 12px; padding: 12px; color: #fff; font-size: 14px; margin-bottom: 12px; outline: none; }
    .btn { width: 100%; background: #ff3b5c; color: #fff; border: none; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 15px; cursor: pointer; }
    .toast { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); background: #222; padding: 10px 20px; border-radius: 20px; font-size: 13px; display: none; z-index: 100; border: 1px solid #ff3b5c; color: #ff6b8b; }
  </style>
</head>
<body>

  <div id="toastBox" class="toast"></div>

  <div class="card" id="loginCard">
    <h2 style="margin-bottom: 15px; text-align: center;">💖 Chat Login</h2>
    <input type="text" id="userCodeInp" class="input-box" placeholder="User ID (e.g. @amit)" autocomplete="off">
    <input type="password" id="passwordInp" class="input-box" placeholder="6-Digit PIN (e.g. 123456)" maxlength="6" inputmode="numeric">
    <button class="btn" onclick="directLogin()">Login & Start</button>
  </div>

  <div id="chatApp" style="display:none; width:100%; height:100%; flex-direction:column;">
    <h2>Welcome to Chat! 🎉</h2>
    <p id="welcomeUser" style="color: #ff6b8b; margin-top: 10px;"></p>
  </div>

  <script>
    const socket = io();

    function showToast(msg) {
      const t = document.getElementById('toastBox');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 3000);
    }

    function directLogin() {
      const uCode = document.getElementById('userCodeInp').value.trim();
      const pass = document.getElementById('passwordInp').value.trim();

      if (!uCode.startsWith('@') || uCode.length < 2) {
        return showToast("❌ User ID must start with @");
      }
      if (!pass || pass.length !== 6) {
        return showToast("❌ PIN must be 6 digits");
      }

      socket.emit('auth-user', { userCode: uCode, password: pass, fullName: uCode, avatar: '', isRegister: true }, (res) => {
        if (res && res.success) {
          document.getElementById('loginCard').style.display = 'none';
          document.getElementById('chatApp').style.display = 'flex';
          document.getElementById('welcomeUser').textContent = "Logged in as: " + res.user.userCode;
        } else {
          showToast(res ? res.error : "Login failed");
        }
      });
    }
  </script>
</body>
</html>
