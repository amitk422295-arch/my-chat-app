<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Web Live</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #111b21; color: #e9edef; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

    /* Top Toast Notification Popup */
    #toast {
      position: fixed; top: -60px; left: 50%; transform: translateX(-50%);
      background-color: #00a884; color: #fff; padding: 12px 24px;
      border-radius: 30px; font-size: 14px; font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4); z-index: 9999;
      transition: top 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    #toast.show { top: 20px; }

    /* Header & Tabs */
    header { background-color: #202c33; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .nav-tabs { display: flex; background-color: #202c33; border-bottom: 1px solid #374248; }
    .tab { flex: 1; text-align: center; padding: 12px 0; color: #8696a0; cursor: pointer; font-weight: bold; font-size: 14px; text-transform: uppercase; }
    .tab.active { color: #00a884; border-bottom: 3px solid #00a884; }

    /* Containers */
    .view-panel { flex: 1; overflow-y: auto; display: none; flex-direction: column; }
    .view-panel.active { display: flex; }

    /* Status Screen */
    .status-panel { padding: 16px; }
    .my-status-box { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .add-status-btn { width: 50px; height: 50px; border-radius: 50%; background: #00a884; display: flex; justify-content: center; align-items: center; font-size: 24px; color: white; cursor: pointer; }
    .status-card { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #222d34; cursor: pointer; }
    .status-card img, .status-card video { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid #00a884; }
    .status-info { flex: 1; }
    .status-viewers-count { font-size: 12px; color: #8696a0; }

    /* Uploading Progress Box */
    #uploadProgressBox { display: none; background: #202c33; padding: 12px; border-radius: 8px; margin: 10px 0; }
    .progress-bar-bg { width: 100%; height: 6px; background: #374248; border-radius: 3px; overflow: hidden; margin-top: 6px; }
    .progress-bar-fill { height: 100%; width: 0%; background: #00a884; transition: width 0.2s; }

    /* Chat Messages */
    #chatList { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .msg-bubble { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 14px; position: relative; word-wrap: break-word; }
    .msg-sent { align-self: flex-end; background-color: #005c4b; color: #e9edef; }
    .msg-received { align-self: flex-start; background-color: #202c33; color: #e9edef; }
    .msg-time { font-size: 10px; color: #8696a0; text-align: right; margin-top: 4px; }
    .msg-bubble img, .msg-bubble video { max-width: 100%; border-radius: 6px; margin-top: 4px; }

    /* Chat Footer Input */
    .chat-footer { background-color: #202c33; padding: 8px 12px; display: flex; align-items: center; gap: 8px; }
    .chat-footer input[type="text"] { flex: 1; background: #2a3942; border: none; padding: 10px 14px; border-radius: 20px; color: white; outline: none; }
    .chat-footer button { background: #00a884; border: none; color: white; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 16px; }

    /* Modal / Viewer View */
    #statusModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10000; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
    #modalMediaContainer { max-width: 90%; max-height: 70vh; display: flex; justify-content: center; }
    #modalMediaContainer img, #modalMediaContainer video { max-width: 100%; max-height: 70vh; border-radius: 8px; }

    /* Calling Overlay */
    #callOverlay { display: none; position: fixed; inset: 0; background: #111b21; z-index: 10001; flex-direction: column; align-items: center; justify-content: space-around; }
    .call-avatar { width: 120px; height: 120px; border-radius: 50%; background: #202c33; display: flex; align-items: center; justify-content: center; font-size: 48px; }
    .call-actions { display: flex; gap: 30px; }
    .btn-call { width: 60px; height: 60px; border-radius: 50%; border: none; color: white; font-size: 20px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
    .btn-accept { background: #00a884; }
    .btn-reject { background: #ea0038; }
  </style>
</head>
<body>

  <!-- 🟢 Top Toast Popup -->
  <div id="toast">स्टेटस अपडेट हो गया!</div>

  <!-- Header -->
  <header>
    <h3 style="color:#00a884;">WhatsApp Clone</h3>
    <button onclick="startVoiceCall()" style="background:#2a3942; border:none; color:white; padding:6px 12px; border-radius:15px; cursor:pointer;">📞 Call</button>
  </header>

  <!-- Navigation Tabs -->
  <div class="nav-tabs">
    <div class="tab active" onclick="switchTab('chats')">Chats</div>
    <div class="tab" onclick="switchTab('status')">Status</div>
  </div>

  <!-- 💬 1. Chat Tab -->
  <div id="chatView" class="view-panel active">
    <div id="chatList"></div>
    <div class="chat-footer">
      <input type="text" id="msgInput" placeholder="मैसेज टाइप करें..." onkeypress="if(event.key==='Enter') sendMessage()" />
      <button onclick="sendMessage()">➤</button>
    </div>
  </div>

  <!-- 🟣 2. Status Tab -->
  <div id="statusView" class="view-panel status-panel">
    <div class="my-status-box">
      <label class="add-status-btn">
        +
        <input type="file" id="statusFileInput" accept="image/*,video/*" style="display:none" onchange="handleStatusUpload(event)">
      </label>
      <div>
        <h4>My Status</h4>
        <p style="font-size:12px; color:#8696a0;">फोटो या वीडियो स्टेटस पोस्ट करें</p>
      </div>
    </div>

    <!-- WhatsApp जैसा अपलोडिंग इंडिकेटर -->
    <div id="uploadProgressBox">
      <div style="display:flex; justify-content:space-between; font-size:12px;">
        <span id="uploadStatusText">अपलोडिंग शुरू...</span>
        <span id="uploadPercent">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progressBar" class="progress-bar-fill"></div>
      </div>
    </div>

    <h4 style="color:#8696a0; font-size:13px; margin: 15px 0 10px 0;">RECENT UPDATES</h4>
    <div id="statusList"></div>
  </div>

  <!-- 👁️ Status Viewer Modal -->
  <div id="statusModal">
    <div id="modalMediaContainer"></div>
    <p id="modalCaption" style="margin-top:10px; font-size:16px;"></p>
    <div id="modalSeenCount" style="color:#8696a0; margin-top:6px; font-size:12px;"></div>
    <button onclick="closeStatusModal()" style="margin-top:20px; background:#202c33; border:none; color:white; padding:8px 20px; border-radius:20px;">बंद करें</button>
  </div>

  <!-- 📞 Calling Screen Overlay -->
  <div id="callOverlay">
    <div class="call-avatar">👤</div>
    <h2 id="callerName">Calling...</h2>
    <p id="callState" style="color:#8696a0;">घंटी बज रही है...</p>
    <div class="call-actions">
      <button class="btn-call btn-accept" id="acceptCallBtn" onclick="acceptCall()">📞</button>
      <button class="btn-call btn-reject" onclick="endCall()">✖</button>
    </div>
  </div>

  <script>
    const socket = io();
    const myName = "User_" + Math.floor(1000 + Math.random() * 9000);
    let currentCallingPeer = null;

    // Join Server
    socket.emit('user_join', { name: myName });

    // Toast Pop-up
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // Tab Switching
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
      if(tab === 'chats') {
        document.querySelectorAll('.tab')[0].classList.add('active');
        document.getElementById('chatView').classList.add('active');
      } else {
        document.querySelectorAll('.tab')[1].classList.add('active');
        document.getElementById('statusView').classList.add('active');
      }
    }

    // 💬 WhatsApp Fast Live Chat
    function sendMessage() {
      const input = document.getElementById('msgInput');
      if(!input.value.trim()) return;
      socket.emit('send_message', { text: input.value.trim() });
      input.value = '';
    }

    socket.on('new_message', (msg) => {
      const list = document.getElementById('chatList');
      const isMe = msg.senderName === myName;
      const bubble = document.createElement('div');
      bubble.className = `msg-bubble ${isMe ? 'msg-sent' : 'msg-received'}`;
      bubble.innerHTML = `
        ${!isMe ? `<b style="font-size:11px; color:#00a884;">${msg.senderName}</b><br>` : ''}
        <span>${msg.text}</span>
        <div class="msg-time">${msg.time}</div>
      `;
      list.appendChild(bubble);
      list.scrollTop = list.scrollHeight;
    });

    // 🟣 WhatsApp Like Status Uploading (Photo/Video)
    function handleStatusUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const progressBox = document.getElementById('uploadProgressBox');
      const progressBar = document.getElementById('progressBar');
      const uploadPercent = document.getElementById('uploadPercent');
      const uploadStatusText = document.getElementById('uploadStatusText');

      progressBox.style.display = 'block';
      let currentProgress = 10;
      progressBar.style.width = '10%';
      uploadPercent.innerText = '10%';
      uploadStatusText.innerText = 'अपलोड हो रहा है...';

      const timer = setInterval(() => {
        if(currentProgress < 90) {
          currentProgress += 20;
          progressBar.style.width = currentProgress + '%';
          uploadPercent.innerText = currentProgress + '%';
        }
      }, 150);

      const reader = new FileReader();
      reader.onload = function() {
        clearInterval(timer);
        progressBar.style.width = '100%';
        uploadPercent.innerText = '100%';

        const mediaType = file.type.startsWith('video') ? 'video' : 'image';
        socket.emit('upload_status', {
          media: reader.result,
          mediaType: mediaType,
          text: file.name
        });

        setTimeout(() => {
          progressBox.style.display = 'none';
          showToast('स्टेटस सफलतापूर्वक अपलोड हुआ!');
        }, 500);
      };
      reader.readAsDataURL(file);
    }

    // Render Status Items
    let statusesStore = [];
    socket.on('initial_statuses', (list) => {
      statusesStore = list;
      renderStatuses();
    });

    socket.on('status_published', (newStatus) => {
      statusesStore.unshift(newStatus);
      renderStatuses();
      showToast(`${newStatus.authorName} ने नया स्टेटस लगाया!`);
    });

    socket.on('status_viewed_update', ({ statusId, viewers }) => {
      const item = statusesStore.find(s => s.id === statusId);
      if(item) {
        item.viewers = viewers;
        renderStatuses();
      }
    });

    function renderStatuses() {
      const container = document.getElementById('statusList');
      container.innerHTML = '';
      statusesStore.forEach(s => {
        const div = document.createElement('div');
        div.className = 'status-card';
        div.onclick = () => openStatusViewer(s);
        
        let mediaTag = s.mediaType === 'video' 
          ? `<video src="${s.media}"></video>` 
          : `<img src="${s.media || 'https://via.placeholder.com/50'}" />`;

        div.innerHTML = `
          ${mediaTag}
          <div class="status-info">
            <b>${s.authorName}</b>
            <p style="font-size:11px; color:#8696a0;">${s.timestamp}</p>
          </div>
          <div class="status-viewers-count">👁️ ${s.viewers.length} देखा</div>
        `;
        container.appendChild(div);
      });
    }

    // 👁️ Open & Seen Status Viewer
    function openStatusViewer(status) {
      socket.emit('view_status', { statusId: status.id, viewerName: myName });
      const modal = document.getElementById('statusModal');
      const mediaBox = document.getElementById('modalMediaContainer');
      const caption = document.getElementById('modalCaption');
      const seen = document.getElementById('modalSeenCount');

      mediaBox.innerHTML = status.mediaType === 'video' 
        ? `<video src="${status.media}" controls autoplay></video>`
        : `<img src="${status.media}">`;

      caption.innerText = status.authorName + " का स्टेटस";
      seen.innerText = "देखा गया: " + (status.viewers.join(", ") || "अभी तक किसी ने नहीं देखा");
      modal.style.display = 'flex';
    }

    function closeStatusModal() {
      document.getElementById('statusModal').style.display = 'none';
      document.getElementById('modalMediaContainer').innerHTML = '';
    }

    // 📞 Simple Voice Call Signal
    function startVoiceCall() {
      document.getElementById('callerName').innerText = "Connecting...";
      document.getElementById('callState').innerText = "कॉल लग रही है...";
      document.getElementById('acceptCallBtn').style.display = 'none';
      document.getElementById('callOverlay').style.display = 'flex';
      socket.emit('call_user', { userToCall: 'broadcast', signalData: {}, callType: 'audio' });
    }

    socket.on('incoming_call', (data) => {
      currentCallingPeer = data.from;
      document.getElementById('callerName').innerText = data.callerName;
      document.getElementById('callState').innerText = "इनकमिंग ऑडियो कॉल...";
      document.getElementById('acceptCallBtn').style.display = 'flex';
      document.getElementById('callOverlay').style.display = 'flex';
    });

    function acceptCall() {
      document.getElementById('callState').innerText = "कॉल कनेक्टेड (Live)";
      document.getElementById('acceptCallBtn').style.display = 'none';
      showToast("कॉल कनेक्ट हो गई!");
    }

    function endCall() {
      document.getElementById('callOverlay').style.display = 'none';
      socket.emit('end_call', { to: currentCallingPeer });
      showToast("कॉल समाप्त");
    }

    socket.on('call_ended', () => {
      document.getElementById('callOverlay').style.display = 'none';
      showToast("कॉल कट गई");
    });
  </script>
</body>
</html>
